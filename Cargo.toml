[workspace]
resolver = "2"
members = [
    "crates/hark-app",
    "crates/hark-autostart",
    "crates/hark-audio",
    "crates/hark-config",
    "crates/hark-hotkey",
    "crates/hark-inject",
    "crates/hark-keychain",
    "crates/hark-local-stt",
    "crates/hark-meeting",
    "crates/hark-pipeline",
    "crates/hark-single-instance",
    "crates/hark-spellbook",
    "crates/hark-store",
    "crates/hark-stt",
    "crates/hark-update",
    "crates/hark-voice",
]

[workspace.package]
# Kept in lockstep with package.json (the release source of truth): the built
# binary reports this via env!("CARGO_PKG_VERSION"), and the update checker
# compares it against GitHub release tags. release.yml fails if they drift.
version = "0.70.4"
edition = "2021"
# Tracks current stable (1.100.0, 2026-11-09), raised deliberately rather than
# derived from a dependency: CI and every packaging leg build on stable, and
# Arch `extra` already ships 1.100. The previous 1.97 floor came from
# libsqlite3-sys 0.38/0.39 using cfg_select!; 0.40 (rusqlite 0.43) declares 1.88.
rust-version = "1.100"
license = "MIT"
