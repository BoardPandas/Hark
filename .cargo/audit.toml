# cargo-audit configuration (https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example)
#
# RE-TRIAGED 2026-11-09 (0.69.1): the seven zip / zstd / zstd-safe entries
# (RUSTSEC-2026-0367, -0368, -0369, -0429, -0391, -0398, -0403) are retired,
# not because the reasoning changed but because both of their triggers fired.
# Hark moved to sherpa-onnx 2.0.1, whose -sys build script uses zip 9.5.0
# (and so zstd-safe 8.2.0); and the Word export dropped docx-rs for a
# hand-written package on zip >= 9.0.5. Nothing in Cargo.lock is below 9.0.5,
# the floor for the GitHub-only zip advisories (GHSA-m665-v7pm-7grj and four
# others) that RustSec had not yet indexed.
#
# RE-TRIAGED 2026-09-10 during the dependency sweep that took quick-xml to
# 0.41.0. Two of the three entries that used to live here were the quick-xml
# denial-of-service pair (RUSTSEC-2026-0194 / -0195), ignored on the argument
# that quick-xml was reached only through wayland-scanner's proc macro and so
# never ran against attacker-chosen input. That argument is now moot rather
# than merely narrow: wayland-scanner 0.31.11 resolves against quick-xml
# 0.41.0, which is the version both advisories name as fixed. The entries were
# removed rather than left in place, because an ignore that no longer matches
# anything is not inert -- it silently suppresses that advisory ID if it ever
# reappears against a different crate or version.
#
# The previous re-triage (2026-08-24, for 0.36.0) is what set the
# re-evaluation trigger those two were finally retired on. Triggers work; keep
# writing them.
#
# WHEN THIS FILE IS EDITED: every entry needs a reason and a re-evaluation
# trigger, and the reason has to be one that a Linux build does not falsify.

[advisories]
ignore = [
    # ttf-parser 0.25.1 unmaintained (INFORMATIONAL -- an unmaintained notice,
    # not a vulnerability; no CVE and no known exploit, and the advisory names
    # no fixed version because there is nothing to fix to).
    #
    # THIS ONE SHIPS. It is a runtime dependency via sctk-adwaita -> ab_glyph
    # -> owned_ttf_parser, which is winit's client-side window decoration
    # renderer on Wayland: it parses a font from the user's own system to draw
    # Hark's titlebar. So the input is local and already trusted (a user who
    # can replace your system font can replace your binary), and the code is
    # not on any path that touches audio, transcripts or API keys.
    #
    # Accepted rather than fixed because there is nothing to fix: the whole
    # chain is transitive under eframe, no newer ttf-parser is selectable while
    # ab_glyph pins 0.25, and the alternative is dropping Wayland decorations.
    # Re-checked 2026-09-10 against eframe 0.36 / ab_glyph 0.2.32: unchanged,
    # ttf-parser is still 0.25.1 and still pinned there.
    #
    # RE-EVALUATE IF: this is ever upgraded from informational to a real
    # advisory, or when ab_glyph releases against a maintained parser.
    "RUSTSEC-2026-0192",

    # glib 0.18.5 unsound `VariantStrIter` (UNSOUND -- a warning, not a
    # vulnerability; GHSA-wrw7-89jp-8q8g; triaged 2026-11-09, 0.69.1). The
    # `Iterator` / `DoubleEndedIterator` impls behind
    # `Variant::array_iter_str()` hand C an out-pointer through a shared `&p`,
    # so an optimized build drops the write and then dereferences NULL: a
    # crash, not memory disclosure. Fixed in glib 0.20.
    #
    # THIS ONE SHIPS, Linux only: glib arrives through gtk 0.18, which the
    # Linux tray needs (tray-icon 0.26 -> libappindicator 0.9 -> gtk 0.18, and
    # hark-app's own `gtk = "0.18"` in tray/surface_gtk.rs). The unsound code
    # runs only if something iterates a GVariant string array through that
    # type, and nothing does: grepping Hark's crates and the sources of
    # tray-icon 0.26.0, muda 0.21.0, libappindicator 0.9.0, gtk 0.18.2,
    # gdk 0.18.2 and gio 0.18.4 for `array_iter_str` / `VariantStrIter` finds
    # no caller. No upgrade is selectable: gtk-rs ended the GTK 3 bindings at
    # 0.18, so every GTK 3 tray stack pins glib 0.18.
    #
    # RE-EVALUATE IF: tray-icon (or Hark's Linux tray) moves off
    # libappindicator / GTK 3, e.g. to a StatusNotifierItem-over-D-Bus tray;
    # or any Hark code starts reading GVariants.
    "RUSTSEC-2024-0429",
]
