# Hark default settings.
#
# Hark reads its config from the OS config dir:
#   Windows: %APPDATA%\hark\config.toml
#   macOS:   ~/Library/Application Support/hark/config.toml
# Every key is optional; a missing file or missing key uses the defaults
# shown here.
#
# API keys NEVER live in this file. Set the HARK_STT_KEY environment
# variable (dev), or store a key in the OS keychain under service "hark"
# with the provider label as the account name (e.g. "deepgram").

[startup]
# Launch hidden in the system tray when you sign in.
launch_at_login = true

[general]
always_on_top = false
# false: the X hides Hark in the tray; true: the X exits the program.
# Settings -> General -> Close Program always exits, regardless of this option.
exit_on_close = false

[provider]
kind = "deepgram"    # deepgram | openai | groq | gemini | openai-compatible
# base_url and model default per kind:
#   deepgram -> https://api.deepgram.com, nova-3
#   openai   -> https://api.openai.com/v1, gpt-transcribe
#   groq     -> https://api.groq.com/openai/v1, whisper-large-v3-turbo
#   gemini   -> Live API WebSocket, gemini-3.5-transcribe-live
# "openai-compatible" is the escape hatch for any other server speaking the
# multipart /audio/transcriptions contract; it requires an explicit base_url.
# base_url = "https://api.deepgram.com"
# model = "nova-3"
# Gemini only. "verbatim" (default) keeps the literal transcript and lets your
# cleanup voice run as a second call. "smart" has Gemini strip fillers and
# format in the same call -- one round trip instead of two, but history then
# stores the tidied text rather than what you actually said, and invocation
# triggers are matched against the tidied text.
# live_mode = "verbatim"

[hotkey]
# Push-to-talk chord: hold ALL listed keys to record, release any to stop.
# "+"-separated key names, e.g. "LCtrl+LWin", "RCtrl", "F13".
ptt_key = "LCtrl+LWin"

[audio]
preroll_ms = 300      # audio kept from before the chord registers
tail_ms = 150         # audio kept after release (trailing word endings)
max_hold_s = 120      # cap; on exceed, transcribe what we have
min_speech_ms = 250   # shorter holds are dropped (no network request)
silence_rms = 0.01    # drop clips whose loudest 100 ms window is quieter than this

[inject]
strategy = "clipboard"        # clipboard | type
set_paste_delay_ms = 50       # clipboard set -> synthesized Ctrl+V
paste_restore_delay_ms = 50   # Ctrl+V -> restore the old clipboard
clipboard_retries = 8         # bounded retries while the clipboard is busy

[dictionary]
# Canonical terms (names, jargon, product words). Transcript spans that
# sound like a term but are spelled wrong are replaced with the canonical
# spelling; the same list also feeds provider biasing. The pre-Phase-2 key
# name "bias_terms" still works.
terms = []

[local_stt]
# Opt-in on-device transcription. The model is NOT shipped with Hark; it is
# downloaded on demand from Settings -> On-device model (~670 MB on disk,
# ~1.2 GB of RAM once loaded).
#
#   off       never used (default)
#   fallback  cloud first; the local model rescues a failed or timed-out request
#   primary   local only; no provider is contacted and no API key is required
mode = "off"
model = "parakeet-tdt-0.6b-v3-int8"
threads = 2
# Cloud request budget used INSTEAD of the usual 15 s, but only while a
# downloaded model is standing by. Waiting the full 15 s and then decoding
# locally would make a rescued dictation slower than no fallback at all.
fallback_after_ms = 6000

[meeting]
# Meeting transcription ("Hark Meetings"), independent of push-to-talk
# dictation. Start manually from the tray, or let auto-detect offer it.
enabled = true
# mic_device is unset by default: the Windows communications-default
# microphone (the device Windows already treats as the one calls use).
# mic_device = "Yeti Stereo Microphone"
# system_source = "all" | "app"
#   app  (default) a detected meeting captures only that app's process tree
#   all  always capture everything except Hark; always used for a manually
#        started meeting regardless of this setting
system_source = "app"
live_transcript = true    # rolling transcript in the live pane while recording
# final_pass = "deepgram" | "none"
#   deepgram (default) re-transcribe with diarization for Speaker 1/2/3
#            labels (~$0.52/hour); needs its own Deepgram key
#   none     keep the live Me/Them transcript as final; no second pass, no cost
final_pass = "deepgram"
summary = true             # generate a summary after the final pass
# summary_template is unset by default: the built-in template.
# summary_template = "Summarize as bullet points."
consent_reminder = true       # show the first-run recording-consent notice
consent_acknowledged = false  # whether that notice has been seen
# Circular storage cap for recording audio, in MB. 0 = don't keep audio at
# all (deleted as soon as the final pass and summary are saved). Clamped to
# 0..=1048576 (1 TB) at load; the Settings page edits this in GB.
audio_cap_mb = 5120
compress_audio = true      # compress kept recordings to stereo MP3
# auto_detect = "off" | "ask" | "auto"
#   off   never prompt or auto-start; a meeting only begins manually
#   ask   (default) non-modal prompt when a meeting app takes the mic
#   auto  start recording silently on detection (tray + live indicator
#         still always visible)
auto_detect = "ask"
auto_stop_after_s = 60   # stop once the detected app releases the mic this
                          # long; 0 = never auto-stop
# detect_apps is unset by default: the built-in list Hark ships with.
# detect_apps = ["ms-teams.exe", "zoom.exe"]

# Invocations: say a trigger phrase, get a fixed block of text you wrote.
# The expansion is injected byte for byte and never goes through a cleanup
# voice, so it cannot be reworded on the way to the cursor. A dictation that
# fires one also skips the cleanup call entirely.
#
#   scope = "utterance"  the phrase must be the WHOLE dictation (default)
#   scope = "anywhere"   the phrase is spliced into a longer sentence
#
# A trigger needs at least two words, a non-empty expansion, and a phrase no
# earlier trigger or alternate already uses. Optional aliases are exact
# alternate transcriptions for things your provider repeatedly hears instead.
# Invalid entries/aliases are skipped at startup rather than failing the whole
# config; the Invocations page marks each one with the reason.
#
# This section stays LAST: [[...]] array-of-tables entries must follow every
# scalar key, which is also where Hark writes it when it saves.
#
# [[invocations.entries]]
# phrase = "access granted"
# aliases = ["a cess granted"]
# scope = "utterance"
# expansion = """
# You have access to the Support Forge tools: ticketing, remote assist,
# and the asset inventory.
# """
