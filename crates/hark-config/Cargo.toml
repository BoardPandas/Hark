[package]
name = "hark-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hark settings: TOML load/save with defaults (provider, model, base URL, PTT chord, timing knobs, history retention). API keys never live here."

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
# Schema migration is the only thing here that reports: it happens once, off
# any hot path, and a silent rewrite of the user's config would be worse.
log = "0.4"

[dev-dependencies]
tempfile = "3"
