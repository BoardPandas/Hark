[package]
name = "hark-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hark dictation pipeline: worker-thread state machine gluing audio capture, push-to-talk, cloud STT, and injection. Owns the pre-warmed shared HTTP client."

[dependencies]
hark-audio = { path = "../hark-audio" }
hark-config = { path = "../hark-config" }
hark-spellbook = { path = "../hark-spellbook" }
hark-hotkey = { path = "../hark-hotkey" }
hark-inject = { path = "../hark-inject" }
# Opt-in on-device STT. The native engine sits behind this crate's own
# "engine" feature, forwarded from hark-app; without it only the model
# download/management half compiles in.
hark-local-stt = { path = "../hark-local-stt" }
# Meeting mode (src/meeting/): the pure session logic, chunker, detector and
# storage-cap rules it drives from worker threads.
hark-meeting = { path = "../hark-meeting" }
hark-keychain = { path = "../hark-keychain" }
hark-stt = { path = "../hark-stt" }
hark-voice = { path = "../hark-voice" }
# Meeting ids and start times are wall-clock (a folder named after the local
# start time); already locked through hark-app.
jiff = "0.2"
log = "0.4"
# Only to NAME the shared client type hark-stt hands us (and fire the
# pre-warm request). Same version/features as hark-stt; cargo unifies them.
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
thiserror = "2"

# Optional foreground-app Insights use the same native bindings already
# locked elsewhere in Hark. No document/window title or permission prompt.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }

[features]
default = []
# Forwarded by hark-app; pulls the ~28 MB native sherpa-onnx engine in.
engine = ["hark-local-stt/engine"]
# Forwarded by hark-app; pulls tokio + a WebSocket client in for Gemini Live.
live = ["hark-stt/live"]

[dev-dependencies]
tempfile = "3"
