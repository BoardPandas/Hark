[package]
name = "hark-stt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hark BYOK cloud speech-to-text: SttProvider trait with OpenAI-compatible, Deepgram, Gemini and live WebSocket adapters."

[dependencies]
# Static trust roots, no OS cert store: reqwest 0.13.2+ removed its
# "webpki-roots" feature and made rustls-platform-verifier (the OS store) the
# default, so the roots now come from webpki-root-certs and every client is
# built with tls_certs_only (see static_trust_roots in lib.rs). Requesting the
# old feature does not error; cargo silently pins reqwest to 0.13.1 instead
# (LL-G cargo-update-silent-holdback-on-feature-removal).
# No "multipart" feature: reqwest streams multipart bodies, which masks
# connect/timeout errors as opaque body errors; we assemble multipart by hand.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "json",
] }
# Mozilla's root set as full DER certificates, which is what
# reqwest::Certificate::from_der takes (webpki-roots ships trust anchors only).
# Already in the tree under rustls-platform-verifier, so no new vendor surface.
webpki-root-certs = "1"
# Gemini takes inline audio as base64 in a JSON body (there is no multipart
# path); already in the tree as a transitive dep, so no new vendor surface.
base64 = "0.23"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The two live adapters (Gemini Live, OpenAI live transcribe) are the only
# things in this crate that need an async runtime: both providers stream over
# a bidirectional WebSocket. Each adapter owns a private, current-thread
# runtime driven with block_on from the pipeline worker thread, so neither
# becomes a process-wide executor and no other adapter's blocking reqwest call
# ever runs on one (LL-G Rust HIGH, blocking-io-on-tokio).
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "net",
    "io-util",
    "time",
], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
], optional = true }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
], optional = true }
# OpenAI's realtime API accepts only 24 kHz, so its replay path upsamples the
# stored 16 kHz clip with one whole-clip process_all (LL-G Rust HIGH,
# rubato-4-whole-clip-process-all). The version hark-audio already pins; not
# hark-audio itself, which would drag cpal into this crate.
rubato = { version = "5.0", optional = true }

[features]
default = []
# Pulls in tokio + a WebSocket client for the live adapters, and the resampler
# OpenAI's replay needs. Off here so the crate stays runtime-free by default;
# hark-app turns it on.
live = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:rubato"]

[dev-dependencies]
hound = "3.5"
# The live probe turns on the adapter's own diagnostics; without a logger
# installed its log lines go nowhere and the probe proves less than it could.
env_logger = "0.11"
# The Gemini spike reuses the tuned voice prompts and the expansion guard
# rather than reinventing either inside the STT crate.
hark-voice = { path = "../hark-voice" }

# The live probe needs the async stack the `live` feature brings in; without
# it the example would fail to compile for anyone running a plain `cargo test`.
[[example]]
name = "gemini_live_probe"
required-features = ["live"]

[[example]]
name = "openai_live_probe"
required-features = ["live"]
