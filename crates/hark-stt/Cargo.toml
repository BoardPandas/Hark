[package]
name = "hark-stt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hark BYOK cloud speech-to-text: SttProvider trait with OpenAI-compatible, Deepgram and Gemini adapters."

[dependencies]
# Static trust roots, no OS cert store: reqwest 0.13.2+ removed its
# "webpki-roots" feature and made rustls-platform-verifier (the OS store) the
# default, so the roots now come from webpki-root-certs and every client is
# built with tls_certs_only (see static_trust_roots in lib.rs). Requesting the
# old feature does not error; cargo silently pins reqwest to 0.13.1 instead
# (LL-G cargo-update-silent-holdback-on-feature-removal).
# No "multipart" feature: reqwest streams multipart bodies, which masks
# connect/timeout errors as opaque body errors; we assemble multipart by hand.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "json",
] }
# Mozilla's root set as full DER certificates, which is what
# reqwest::Certificate::from_der takes (webpki-roots ships trust anchors only).
# Already in the tree under rustls-platform-verifier, so no new vendor surface.
webpki-root-certs = "1"
# Gemini takes inline audio as base64 in a JSON body (there is no multipart
# path); already in the tree as a transitive dep, so no new vendor surface.
base64 = "0.23"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The Gemini Live adapter is the only thing in this crate that needs an async
# runtime: the Live API is a bidirectional WebSocket, with no REST equivalent
# that accepts inline audio. The runtime is a private, current-thread instance
# owned by that adapter and driven with block_on from the pipeline worker
# thread, so it never becomes a process-wide executor and no other adapter's
# blocking reqwest call ever runs on it (LL-G Rust HIGH, blocking-io-on-tokio).
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "net",
    "io-util",
    "time",
], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
], optional = true }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
], optional = true }

[features]
default = []
# Pulls in tokio + a WebSocket client for the Gemini Live adapter. Off here so
# the crate stays runtime-free by default; hark-app turns it on.
live = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]

[dev-dependencies]
hound = "3.5"
# The live probe turns on the adapter's own diagnostics; without a logger
# installed its log lines go nowhere and the probe proves less than it could.
env_logger = "0.11"
# The Gemini spike reuses the tuned voice prompts and the expansion guard
# rather than reinventing either inside the STT crate.
hark-voice = { path = "../hark-voice" }

# The live probe needs the async stack the `live` feature brings in; without
# it the example would fail to compile for anyone running a plain `cargo test`.
[[example]]
name = "gemini_live_probe"
required-features = ["live"]
