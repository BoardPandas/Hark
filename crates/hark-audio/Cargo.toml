[package]
name = "hark-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hark audio capture: cpal input stream, lock-free ring buffer with absolute sample counter, device-rate to 16 kHz mono resampling, pre-roll/tail window assembly, silence gate."

[dependencies]
# Pin the exact minor: WASAPI host is built in; we request F32 explicitly and
# never trust default_input_config() heuristics (spec §2.4).
cpal = "0.18.1"
# rubato 4.0 (2026-07-09) consolidated the old FftFixedIn/SincFixedIn family
# into `Fft` + `FixedSync`. `process_all()` is the whole-clip path: it trims
# the FFT startup delay and yields exact output frame counts, which our unit
# tests assert on. Do NOT call process() once with chunk_size == clip length;
# that leaves the delay in and truncates the tail.
rubato = "5.0"
log = "0.4"
thiserror = "2"
# WAV reader/writer for the mono share export and the archive's verify pass
# (already locked as a dev-dep for spool's own tests).
hound = "3.5"
# Meeting-worker acoustic echo cancellation, pinned to the evaluated Rust engine.
aec3 = "=0.4.0"
# Meeting audio archive (D9) and sharing (D8): resolves to 0.2.5 (sys 0.1.11,
# LAME 3.100), confirmed in the CP0 spike. LAME is LGPL and statically
# linked via mp3lame-sys's vendored build; the notice/relink obligation is
# handled in About + the installer, not here (§4.10/§4.11 of the meetings
# plan). LL-G HIGH `kb/rust/mp3lame-encode-to-vec-no-reserve.md`: every
# encode_to_vec/flush_to_vec call must reserve first, or LAME treats the
# Vec's 0 spare capacity as "unbounded" and overflows the heap.
mp3lame-encoder = "0.2"
# Decodes the MP3 archive back to PCM for the compress-then-verify step and
# for exporting audio from an already-compressed meeting. Pure Rust
# (MPL-2.0), no native codec dependency; only the mp3 feature is enabled.
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }

# cpal resolves the default capture device by the eConsole role only, but
# Windows keeps a SECOND capture default for the eCommunications role -- the
# one every headset setup guide tells users to set. When they differ, Hark and
# Teams listen to different microphones. cpal exposes no way to ask, so query
# WASAPI directly to label it in the device picker.
# - Win32_Media_Audio: IMMDeviceEnumerator, MMDeviceEnumerator, eCapture, eCommunications
# - Win32_System_Com: CoCreateInstance/CoInitializeEx, STGM_READ
# - Win32_Devices_FunctionDiscovery: PKEY_Device_FriendlyName
# - Win32_UI_Shell_PropertiesSystem: IPropertyStore
# Meeting-mode per-process loopback (loopback_win.rs) adds:
# - Win32_System_Com_StructuredStorage + Win32_System_Variant: the VT_BLOB
#   PROPVARIANT carrying AUDIOCLIENT_ACTIVATION_PARAMS
# - Win32_System_Threading + Win32_Security: CreateEventW / WaitForSingleObject
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
# `#[implement]` (the activation completion handler) expands to paths in
# windows-core, so it must be a direct dependency. Same version the windows
# crate already pulls in. Do not follow crates.io to windows-core 0.100: that
# is a new windows-rs line the windows crate (0.62.2) does not use, and a
# second windows-core makes #[implement] target the wrong traits.
windows-core = "0.62"

# Meeting-mode system-audio loopback (loopback/linux.rs): the official Rust
# bindings, linking libpipewire-0.3 through pkg-config. v0_3_44 is the
# TARGET_OBJECT key (per-stream targeting), present since PipeWire 0.3.44
# (2022) — every supported distro ships newer. Build-time note: the -sys
# crates run bindgen, which needs libclang; CI installs it, and
# packaging/LINUX.md records the dev-machine workaround.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_44"] }
# CLOCK_MONOTONIC for the loopback's start timestamp (the recorder's timeline
# aligns by sample count; the timestamp is for diagnostics and smoke tests).
libc = "0.2"

[dev-dependencies]
# Spool and archive tests build synthetic tones and read files back inside a
# temp dir.
tempfile = "3"
# The loopback smoke example is a hand tool: it shows the capture thread's
# state transitions, which log rather than print.
env_logger = "0.11"

[build-dependencies]
cc = "1"
