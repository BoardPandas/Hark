[package]
name = "hark-meeting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hark meeting mode, pure logic: the per-meeting session state machine, the per-channel live chunker, and the Me/Them transcript merge. No I/O, no clocks."

[dependencies]
# Only for the loudness statistics: a live chunk is judged by the same
# loudest-window gate as a push-to-talk clip, never by a whole-chunk mean.
hark-audio = { path = "../hark-audio" }
