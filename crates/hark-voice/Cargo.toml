[package]
name = "hark-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hark BYOK voice layer: cleanup voices, prompt assembly, and the OpenAI-compatible chat-completions adapter."

[dependencies]
# Same reqwest surface as hark-stt; callers pass the process-wide client from
# hark_stt::shared_client(), which pins the static trust roots.
# No "multipart" feature: chat-completions is a plain buffered JSON POST.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "json",
] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# The cleanup spike reuses the STT crate's shared client (production wiring:
# one client per process) and its LatencyTally/contains_term helpers.
hark-stt = { path = "../hark-stt" }
