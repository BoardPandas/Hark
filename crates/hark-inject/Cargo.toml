[package]
name = "hark-inject"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hark text injection: clipboard stash/set/paste/restore with bounded retries, plus an enigo char-typing fallback for paste-hostile fields."

[dependencies]
# Text-only clipboard round-trip; image-data (a default feature) is unused, so
# drop it. Known v1 limitation: set_text clears non-text formats, so images/
# RTF/HTML on the clipboard before dictation are not preserved (spec §12).
arboard = { version = "3.6.1", default-features = false }
# default-features = false drops the X11 stack on Windows/macOS (spec §2.4).
# Pinned: the LLKHF_INJECTED contract has regressed across enigo versions
# before (RustDesk #14667); a real-HW test asserts our hook ignores our own
# synthesized Ctrl+V.
enigo = { version = "0.6.1", default-features = false }
log = "0.4"
thiserror = "2"

# Linux is a ship target as of 0.36.0. enigo refuses to build unless a backend
# is named, so name the pure-Rust one (x11rb needs no C libraries); it drives
# X11 sessions, where it resolves keysyms against the active layout. Wayland
# has no XTEST, so key synthesis there goes through a uinput virtual keyboard
# instead -- the same evdev crate hark-hotkey reads with, so one permission
# (the `input` group) covers both directions. The 0.6.1 pin and
# default-features = false above are unchanged.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
evdev = "0.13.2"

# The clipboard itself is display-server-specific too: arboard's default build
# speaks X11 only, and a Wayland-native app that never touched X would find the
# clipboard empty. `wayland-data-control` adds the wlr-data-control path, which
# arboard prefers when WAYLAND_DISPLAY is set and falls back from on X11.
[target.'cfg(target_os = "linux")'.dependencies.arboard]
version = "3.6.1"
default-features = false
features = ["wayland-data-control"]
