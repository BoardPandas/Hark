[package]
name = "hark-meeting-aec-bakeoff"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately independent: neither candidate enters Hark's dependency graph.
[workspace]

[features]
default = []
rust-aec3 = ["dep:aec3"]
cpp-webrtc = ["dep:webrtc-audio-processing"]

[dependencies]
aec3 = { version = "=0.4.0", optional = true }
webrtc-audio-processing = { version = "=2.1.0", features = ["bundled"], optional = true }
hound = "=3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
