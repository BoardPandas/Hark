# Continuous integration: the gate for the standards CLAUDE.md calls mandatory.
#
# Until this file existed, `release.yml` was the repo's only workflow and it
# triggers solely on a `v*` tag. Nothing ran fmt, clippy, or the test suite on a
# push or a PR -- "cargo fmt + cargo clippy --all-targets -- -D warnings must
# pass" was enforced by prose in CLAUDE.md and nothing else. A rule that matters
# needs a mechanism, not a paragraph.
#
# DELIBERATELY NO TAG TRIGGER. release.yml owns `v*` tags and signs with Azure
# Trusted Signing over OIDC; the OIDC subject claim is derived from the ref, so
# workflows that touch tags are kept strictly separate (LL-G github-actions,
# HIGH: "adding a tag trigger changes the OIDC subject and breaks Azure
# signing"). CI must never be able to perturb the signing path.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rule scoping and hook matchers fail SILENTLY when miswired: a rule with a
  # dead glob is indistinguishable from one that simply has not triggered. This
  # guard is the only thing that makes that failure mode observable.
  #
  # ON BOTH PLATFORMS, on purpose. release.yml also runs this guard, on
  # windows-latest, and until 0.35.8 the guard had only ever executed on ubuntu
  # -- so the release path depended on untested behaviour. Node's fs.globSync is
  # where any divergence would show: the rule globs are forward-slash (required
  # by node glob everywhere) but results come back with platform separators.
  # Running it here on Windows too means a divergence surfaces on an ordinary
  # push instead of on a release tag.
  #
  # Dependency-free apart from Node, so there is nothing to install and nothing
  # to compile; it stays a fail-fast gate on both legs.
  wiring:
    name: Claude wiring guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to 24: the guard needs fs.globSync, which lands in Node 22.
      # Matches the pin in release.yml -- change both together.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Claude wiring guard (rule scoping + hook matchers)
        run: npm run check:claude

  # Formatting is platform-independent; checking it once is enough. Kept separate
  # from `wiring` so it is not run twice by that job's matrix.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by SHA, not by the `stable` branch name: that branch is mutable, so
      # `@stable` would run whatever was last pushed to it. `toolchain: stable` is
      # what actually selects the Rust channel now that the ref no longer says so.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  # Dependency advisories. A separate job, not a step in `wiring`/`fmt`: those
  # are meant to stay compilation-free and finish in seconds, and installing
  # cargo-audit compiles. Runs on ubuntu because it only reads Cargo.lock -- no ALSA, X11 or
  # GTK headers needed, unlike the build matrix below.
  #
  # This job CAN go red without anyone touching the repo, because advisories are
  # published upstream. That is the point: before this existed, `.cargo/audit.toml`
  # documented a careful triage that nothing ever ran, and RUSTSEC-2026-0257
  # (webbrowser, argument injection via $BROWSER) sat unnoticed for three weeks.
  #
  # WHEN THIS FAILS: fix the dependency, or -- if the advisory genuinely does not
  # reach a shipped target -- add it to `.cargo/audit.toml` WITH A REASON and a
  # re-evaluation trigger, the way the three Linux-only wayland/ttf-parser entries
  # already there are handled. Do not delete this job.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable

      # Caches ~/.cargo/bin too, so cargo-audit is compiled once and restored
      # afterwards rather than rebuilt on every run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Reads .cargo/audit.toml for the ignore list. Exits non-zero on any
      # unignored vulnerability; the `unmaintained`/`unsound` notices stay
      # warnings.
      - name: cargo audit
        run: cargo audit

  # Build and test on the platforms Hark ships on -- all three of them since
  # 0.36.0, when Linux became a ship target rather than a place the workspace
  # merely happened to compile.
  #
  # ubuntu needs a dev-header install the other two do not (see the step
  # below); that is the whole reason it used to be excluded here. It is not a
  # reason to exclude it now that Linux is a shipped artifact: the platform
  # with the most platform-specific code in it (evdev push-to-talk, uinput
  # paste, XDG autostart, the GTK tray thread) was the one platform nothing
  # compiled on in CI.
  rust:
    name: clippy + tests (${{ matrix.os }})
    needs: [wiring, fmt]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux links against system libraries the other runners either bundle or
      # do not need. A missing one fails at link time with an unresolved symbol
      # and nothing that names the package, so the mapping is written down.
      # Keep it in step with the PKGBUILD's depends:
      #   libasound2-dev                cpal, microphone capture
      #   libgtk-3-dev                  GTK, which the tray is built out of
      #   libxdo-dev                    libxdo, linked for muda's menu items
      #   libayatana-appindicator3-dev  the tray icon (dlopened at RUN time, so
      #                                 this is here for the runtime .so, not
      #                                 for headers -- libappindicator-sys has
      #                                 no build script)
      #   libxkbcommon-dev, libx11-dev  dlopened by winit's xkbcommon-dl/x11-dl
      #   cmake, clang                  sherpa-onnx builds its native engine
      # NOT here: libudev-dev. evdev 0.13 talks to the kernel through nix and
      # has no C dependency; naming it would be a lie that outlives the check.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libxkbcommon-dev libx11-dev pkg-config cmake clang

      # `toolchain: stable` is a channel, not a version pin -- matching release.yml.
      # The workspace rust-version = "1.97" floor makes cargo error if a runner's
      # stable ever drifts below it. The action itself is SHA-pinned; see the gate
      # job for why.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable
          components: clippy

      # SHA-pinned like every other third-party action here. The trailing comment
      # records which release the SHA is, so bumping it stays a reviewable diff.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      # Verbatim the standard in CLAUDE.md, including --all-targets: without it
      # cargo skips test targets entirely, so lints in tests go unchecked
      # (LL-G rust/cargo-check-skips-test-targets).
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
