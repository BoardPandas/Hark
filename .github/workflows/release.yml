# Build, sign, and publish a release of Hark: a signed Windows installer, plus
# Linux packages for Debian/Ubuntu, Fedora/RHEL/openSUSE and Arch.
#
# Trigger: push a SemVer tag (v0.13.0). The tag's version must match
# package.json (the repo's version source of truth, per
# .claude/rules/commit-changelog.md), or the run fails before building.
# workflow_dispatch is a manual fallback that takes an existing tag.
#
# Signing: Azure Trusted Signing (the service is now branded "Artifact
# Signing"; the action Azure/trusted-signing-action redirects to
# Azure/artifact-signing-action). Auth is a service principal passed via
# the action's own with: inputs (azure-client-id / -tenant-id /
# -client-secret), which it promotes to DefaultAzureCredential's env.
#
# The Linux jobs need no secrets at all: distribution packages are verified by
# the repository they come from, and Hark publishes to GitHub Releases rather
# than to an apt/dnf repo, so there is nothing for a GPG key to sign into.
#
# JOB SHAPE
#
#   version                 seconds; verifies the tag and creates the release
#     |- release  (windows) ~21 min; signs, packages, attaches
#     `- linux    (ubuntu)  ~30 min; deb + rpm + tarball, attaches
#          `- linux-arch    ~30 min; makepkg, attaches
#
# The two big builds used to be serial -- `linux` had `needs: release` -- purely
# because whichever job ran first had to be the one that CREATED the release
# object. softprops/action-gh-release creates a release when the tag has none
# and updates it when it does, so two jobs starting together both try to create
# it and the loser gets a 422. Hoisting that creation into `version` leaves
# every build job doing nothing but APPEND, which is safe to do concurrently,
# and takes the wall clock from ~81 min to ~51 min.
#
# `linux-arch` stays downstream of `linux`, deliberately: it builds with
# `makepkg --nocheck`, and skipping the suite is only defensible while the
# ubuntu job has already run it in full against the same commit.
#
# Required GitHub Actions secrets (synced from Doppler). See
# .github/RELEASING.md for the Azure RBAC role and one-time setup:
#   AZURE_CLIENT_ID
#   AZURE_TENANT_ID
#   AZURE_CLIENT_SECRET
#   AZURE_TRUSTED_SIGNING_ENDPOINT           e.g. https://eus.codesigning.azure.net/
#   AZURE_TRUSTED_SIGNING_ACCOUNT_NAME       the Trusted Signing account name
#   AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME  the certificate profile name

name: Release

# DO NOT ADD TRIGGERS HERE. The Azure signing service principal is federated on
# a subject claim derived from the ref, so changing what starts this workflow
# changes the identity presented to Entra and signing fails with
# AADSTS700213 (LL-G github-actions/tag-trigger-breaks-azure-oidc, HIGH).
# Restructuring jobs and steps within the workflow does not touch that claim.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.13.0)"
        required: true

# The release step creates a release and uploads an asset.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The gate every other job hangs off, and the only job that ever creates the
  # release object. Seconds long: no Rust toolchain, no secrets, nothing to
  # compile.
  #
  # Both checks here used to live inside the Windows job, where the Linux jobs
  # inherited them only by accident of `needs: release`. Now that the builds run
  # in parallel there is no such accident left to rely on, so the version
  # agreement and the wiring guard sit upstream of all three builds instead of
  # inside one of them. A red guard or a mistagged commit now stops the release
  # before any job has built -- or created -- anything.
  version:
    name: Version gate + release object
    runs-on: ubuntu-latest
    # Consumed by all three build jobs so the tag/package.json/Cargo.toml
    # agreement is verified exactly once, in the step below, rather than
    # re-derived three times with three chances to disagree.
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # The tag is authoritative for the release; package.json must agree so
      # a mistagged build fails loudly instead of shipping a mismatched exe.
      #
      # Still pwsh, verbatim from when this step lived in the Windows job:
      # PowerShell is preinstalled on the ubuntu runner image, the script is
      # plain cross-platform pwsh, and rewriting a release gate in another
      # language to move it between runners is how a gate quietly stops
      # gating. If the image ever drops pwsh this fails in seconds, loudly,
      # before anything is built.
      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $ref = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($ref -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected a vMAJOR.MINOR.PATCH tag, got '$ref'." }
          $version = $ref.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $pkg) {
            throw "Tag '$ref' (version '$version') does not match package.json version '$pkg'. Bump package.json or retag."
          }
          # The binary reports the Cargo workspace version (env!("CARGO_PKG_VERSION")),
          # which the in-app update checker compares against release tags. It must
          # match package.json, or a shipped build misreports its own version.
          $cargo = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"([^"]+)"')).Groups[1].Value
          if (-not $cargo) { throw "Could not read [workspace.package] version from Cargo.toml." }
          if ($version -ne $cargo) {
            throw "Tag '$ref' (version '$version') does not match Cargo.toml workspace version '$cargo'. Bump Cargo.toml or retag."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$ref"
          Write-Host "Releasing Hark $version from tag $ref"

      # Dependency-free and a few seconds long, which is why it can sit in front
      # of everything without costing anything.
      #
      # This used to be ci.yml's job alone, on the reasoning that the artifact
      # here is Windows so a wiring guard adds nothing. 0.35.4 disproved it: a
      # .claude template sync left the guard failing on main for two weeks, and
      # because ci.yml has no tag trigger, a `v0.35.4` tag would have built,
      # signed and published over a red guard without ever consulting it. The
      # guard is the ONLY check in this workflow that is not otherwise
      # duplicated in the build jobs below, so it is the one this workflow most
      # needed.
      #
      # On ubuntu here, where it once ran on windows-latest, because this job is
      # the common ancestor and gating all three builds is worth more than the
      # runner it happens to run on. Windows coverage of the guard did not go
      # anywhere: ci.yml runs it on ubuntu AND windows on every push, precisely
      # so a fs.globSync path-separator divergence surfaces there rather than on
      # a release tag.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Claude wiring guard (rule scoping + hook matchers)
        run: npm run check:claude

      # THE ONE PLACE A RELEASE IS CREATED. Every build job below passes only
      # tag_name and files, so each is a pure append and they cannot race.
      #
      # generate_release_notes belongs to this call alone: asking for it again
      # on an append would regenerate the body and overwrite it on every
      # subsequent upload.
      #
      # Consequence worth knowing: the release object now exists before any
      # artifact does. It is empty until the Windows job attaches the installer
      # ~20 min later, and it stays empty if that job fails. The in-app update
      # checker reads `releases/latest` and offers whatever tag it finds, asset
      # or no asset, so a failed Windows build leaves a real (if brief) window
      # where Hark offers an update it cannot download. Creating the release
      # from a build job instead is what the 422 race above rules out; making it
      # a draft and publishing it at the end would close the window, but only if
      # action-gh-release resolves a draft by tag reliably, which is not
      # something to find out during a release.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hark ${{ steps.version.outputs.version }}
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Windows: the signed installer, and the only Windows download. Runs in
  # parallel with `linux`; both only append to the release `version` already
  # created.
  release:
    name: Windows (signed installer)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # `toolchain: stable` is a channel, not a version pin: the workspace
      # rust-version = "1.97" floor (Cargo.toml) makes cargo error if the runner's
      # stable is ever older, which is the libsqlite3-sys MSRV trap this guards
      # against.
      #
      # EVERY `uses:` IN THIS JOB IS PINNED BY COMMIT SHA. This job holds
      # `contents: write` and the Azure Trusted Signing service principal, so a
      # floating tag or branch ref here would let an upstream retag run arbitrary
      # code with the power to sign and publish a Hark binary. `dtolnay/rust-toolchain@stable`
      # was the sharpest case: `stable` is a mutable BRANCH, not a tag.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # THE RELEASE GATE. These steps duplicate ci.yml on purpose.
      #
      # ci.yml and release.yml used to be wholly independent, so a tag shipped
      # whatever it pointed at regardless of whether the repo's own checks
      # passed. That is not hypothetical: a stale Windows-only test in
      # hark-hotkey failed CI on every push from 0.33.0 through 0.35.1, and all
      # four Release runs in that window published signed installers anyway.
      #
      # Gating on ci.yml's conclusion instead was considered and rejected.
      # ci.yml deliberately has no tag trigger (adding one changes the OIDC
      # subject claim and breaks Azure signing -- LL-G github-actions, HIGH), so
      # no CI run exists on the tag itself; and workflow_run would run this job
      # in default-branch context, where github.ref is refs/heads/main and the
      # tag-derived version resolution upstream has nothing to read. Querying
      # CI's conclusion for the tagged SHA is racy -- the commit and tag are
      # pushed together, so both workflows start in the same second -- and gives
      # no safe answer when a SHA has no CI run at all (a workflow_dispatch
      # re-release of an old tag). Checking the tree in-process has none of
      # those failure modes: it verifies exactly what is about to be signed.
      #
      # Placed before the build so a bad tree never reaches the signing steps
      # and never spends Trusted Signing quota. Costs ~2-4 min on a ~21 min job.
      #
      # SCOPE: this runner is windows-latest, so cargo fmt/clippy/test here catch
      # Windows and platform-independent failures only -- which is exactly why
      # the ubuntu job below runs its own copy rather than trusting this one.
      # macOS-only clippy/test breakage remains ci.yml's job.
      #
      # Default (debug) profile, deliberately: --all-targets in release profile
      # would drop test executables into target/release, which the signing step
      # globs non-recursively and would then sign and ship. Debug artifacts land
      # in target/debug and leave that glob matching exactly one exe.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # --all-targets matches ci.yml: without it cargo skips test targets
      # entirely, so lints in tests go unchecked (LL-G
      # rust/cargo-check-skips-test-targets).
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # Only hark-app, so target/release holds exactly one top-level exe.
      - name: Build release binary
        run: cargo build --release -p hark-app

      # DefaultAzureCredential fails deep inside signtool with an opaque
      # "SignerSign() failed" if any auth/config secret is empty. Catch that
      # here with a clear message. Lengths only, never the values, so the log
      # stays safe to share.
      - name: Preflight signing secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          SIGN_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
        run: |
          $required = @{
            'AZURE_CLIENT_ID'     = $env:AZURE_CLIENT_ID
            'AZURE_TENANT_ID'     = $env:AZURE_TENANT_ID
            'AZURE_CLIENT_SECRET' = $env:AZURE_CLIENT_SECRET
            'AZURE_TRUSTED_SIGNING_ENDPOINT'          = $env:SIGN_ENDPOINT
            'AZURE_TRUSTED_SIGNING_ACCOUNT_NAME'      = $env:SIGN_ACCOUNT
            'AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME' = $env:SIGN_PROFILE
          }
          $missing = @()
          foreach ($name in $required.Keys | Sort-Object) {
            $len = ($required[$name] ?? '').Trim().Length
            Write-Host ("{0,-42} len={1}" -f $name, $len)
            if ($len -eq 0) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            throw "Empty signing secret(s): $($missing -join ', '). Re-sync from Doppler (hark/prd) into the repo's Actions secrets."
          }

      # v2 reads the service principal from its own inputs (which it promotes
      # to action-scoped env vars for DefaultAzureCredential). Passing the
      # credentials via the step's env: does NOT reach that scope, so they
      # must go here under with: or auth fails with "not fully configured".
      - name: Sign hark-app.exe with Azure Trusted Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A silent no-op signing step must fail the build, not ship unsigned.
      - name: Verify the signature
        shell: pwsh
        run: |
          $exe = "target\release\hark-app.exe"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signature not valid: $($sig.Status) - $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Signature carries no trusted timestamp." }

      # Package the signed exe into a per-user installer (installer/hark.iss).
      # ISCC is not preinstalled on windows-latest. The bundled exe is already
      # signed above; the produced setup.exe is signed in the next step.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DSourceExe=${{ github.workspace }}\target\release\hark-app.exe" `
            installer\hark.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $out = "installer\Output\Hark-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          if (-not (Test-Path $out)) { throw "Installer not produced at $out" }

      # v2 reads the service principal from its own inputs, same as the exe
      # sign step; passing them via env: does not reach DefaultAzureCredential.
      - name: Sign the installer with Azure Trusted Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installer\Output
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A silent no-op signing step must fail the build, not ship unsigned.
      - name: Verify the installer signature
        shell: pwsh
        run: |
          $exe = "installer\Output\Hark-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature not valid: $($sig.Status) - $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Installer signature carries no trusted timestamp." }

      # The installer is the only Windows download now. A portable copy of the
      # raw exe used to ship beside it, and it is deliberately gone: it was a
      # second artifact of the same binary that produced an install Windows knew
      # nothing about (no uninstall entry, no upgrade path), and the in-app
      # updater used to self-replace with it -- which updated the binary while
      # leaving Inno's uninstall record pinned at whatever version installed
      # first. hark-update now downloads THIS asset and runs it.
      - name: Stage the signed installer
        id: asset
        shell: pwsh
        run: |
          $installer = "installer\Output\Hark-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found at $installer" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "installer=$installer"

      # Append only. No name and no generate_release_notes: the `version` job
      # set both when it created the release, and passing them again here would
      # overwrite the body every time an asset lands.
      - name: Attach the Windows installer to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: ${{ steps.asset.outputs.installer }}

  # ---------------------------------------------------------------------------
  # Linux: .deb, .rpm and a portable .tar.gz, built and gated on ubuntu.
  #
  # `needs: version`, not `needs: release`: it needs the release object to exist
  # and the version to be resolved, and both of those now happen upstream, so
  # there is nothing left to wait on the Windows build for. The two run
  # side by side.
  #
  # A consequence of that, stated plainly: a Windows gate failure no longer
  # stops the Linux packages from being attached. Both jobs gate themselves on
  # the same tree, so a failure that would stop one generally stops the other;
  # what is genuinely Windows-only (signing, Inno Setup) can now leave a release
  # holding Linux assets and no installer. That is the trade for the wall clock,
  # and it is visible -- a red job on the run, and a release with no .exe.
  #
  # This job runs its own fmt/clippy/test pass rather than trusting the Windows
  # job's. Those steps there run on windows-latest and so only ever exercise the
  # Windows cfg branches; everything Linux-specific in 0.36.0 -- the evdev
  # listener, the uinput paste, the XDG autostart entry, the GTK tray thread --
  # is invisible to them. Same reasoning the Windows gate is inline: verify
  # exactly what is about to be shipped.
  #
  # GLIBC FLOOR. The binary is dynamically linked, so it requires at least the
  # glibc of the runner that built it -- currently 2.39 (Ubuntu 24.04), which
  # covers Ubuntu 24.04+, Debian 13+ and Fedora 40+, and excludes Debian 12.
  # Building on an older image would widen that, but ubuntu-22.04 begins
  # deprecation in September 2026 and is unsupported from April 2027, so
  # pinning to it would trade a known limitation for a scheduled outage.
  # packaging/LINUX.md states the requirement.
  linux:
    name: Linux (deb + rpm + tarball)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Same list as ci.yml's Linux leg; keep the two in step.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libxkbcommon-dev libx11-dev pkg-config cmake clang

      # SHA-pinned for the same reason every `uses:` in the Windows job is: this
      # workflow holds `contents: write`, so a floating ref here could publish
      # an arbitrary asset onto a Hark release.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Caches ~/.cargo/bin too, so cargo-deb and cargo-generate-rpm are
      # compiled once and restored afterwards instead of on every release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # --all-targets matches ci.yml: without it cargo skips test targets
      # entirely, so lints in tests go unchecked (LL-G
      # rust/cargo-check-skips-test-targets).
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p hark-app

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      # rust-cache restores target/, which on a repeat release still holds the
      # PREVIOUS version's .deb and .rpm. Every step below resolves its artifact
      # with a glob, and a glob that matches two files does not fail loudly --
      # `cp $(ls *.rpm) dest` silently misbehaves, and the verification steps
      # would happily check whichever file sorted first. Clearing the output
      # directories is what makes those globs mean "the package we just built".
      - name: Clear stale package output
        run: rm -rf target/debian target/generate-rpm

      # --no-build: package the binary built above rather than rebuilding it
      # under a different profile. Metadata lives in crates/hark-app/Cargo.toml.
      - name: Build the .deb
        run: cargo deb -p hark-app --no-build

      - name: Build the .rpm
        run: cargo generate-rpm -p crates/hark-app --payload-compress zstd

      # A REAL GATE, not a printout. The tray is loaded through dlopen
      # (libappindicator-sys uses libloading), so it never appears in the
      # binary's DT_NEEDED and neither dpkg-shlibdeps nor rpm's auto-req can
      # infer it. crates/hark-app/Cargo.toml names it explicitly -- and if that
      # line is ever dropped, the packages still build, still install, and the
      # tray simply never appears, with no error anywhere. This step is the only
      # thing that would notice.
      #
      # The $auto-derived entries are checked too: dpkg-shlibdeps failing to
      # launch is a WARNING, not an error, and produces a package that declares
      # no library dependencies at all.
      - name: Verify the packages declare their dependencies
        run: |
          set -euo pipefail
          # Belt and braces with the cleanup step: assert exactly one artifact
          # rather than letting a glob quietly pick one of several.
          [ "$(ls target/debian/*.deb | wc -l)" = 1 ] || { echo "::error::expected exactly one .deb"; exit 1; }
          [ "$(ls target/generate-rpm/*.rpm | wc -l)" = 1 ] || { echo "::error::expected exactly one .rpm"; exit 1; }
          deb=$(ls target/debian/*.deb)
          depends=$(dpkg-deb -f "$deb" Depends)
          echo "deb Depends: $depends"
          for want in libayatana-appindicator3-1 libasound2 libgtk-3-0 libc6; do
            case "$depends" in
              *"$want"*) ;;
              *) echo "::error::.deb Depends is missing $want -- see the packaging metadata in crates/hark-app/Cargo.toml"; exit 1 ;;
            esac
          done

          rpm=$(ls target/generate-rpm/*.rpm)
          requires=$(rpm -qpR "$rpm")
          echo "rpm Requires:"; echo "$requires"
          for want in libayatana-appindicator3.so.1 libasound.so.2 libgtk-3.so.0; do
            case "$requires" in
              *"$want"*) ;;
              *) echo "::error::.rpm Requires is missing $want -- see the packaging metadata in crates/hark-app/Cargo.toml"; exit 1 ;;
            esac
          done

          # The binary must land where packaging/hark.desktop's Exec line points,
          # or the launcher entry is dead on arrival.
          # Captured once rather than piped into `grep -q` twice, for the reason
          # spelled out in the Arch job's verify step: grep -q exits at the
          # match, the producer's next write hits a closed pipe, and pipefail
          # turns that into a failed check on a good package. These two have
          # passed every release so far -- dpkg-deb gets its listing out fast
          # enough -- but it is the same loaded gun, and a gate that can lie
          # about a good build is worse than no gate.
          contents=$(dpkg-deb -c "$deb")
          echo "$contents" | grep -q ' ./usr/bin/hark$' \
            || { echo "::error::.deb does not install /usr/bin/hark"; exit 1; }
          echo "$contents" | grep -q '70-hark-uinput.rules$' \
            || { echo "::error::.deb does not install the udev rule; paste will fail on Wayland"; exit 1; }

      # The escape hatch for distributions the three package formats do not
      # cover. Carries the support files too, because without the udev rule
      # there is no Wayland paste; packaging/LINUX.md has the install commands.
      - name: Stage the assets
        id: asset
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist "tarball/Hark-${VERSION}-linux-x64"
          cp target/release/hark-app "tarball/Hark-${VERSION}-linux-x64/hark"
          cp packaging/hark.desktop packaging/hark.svg \
             packaging/70-hark-uinput.rules packaging/hark-uinput.conf \
             packaging/LINUX.md LICENSE README.md \
             "tarball/Hark-${VERSION}-linux-x64/"
          tar -czf "dist/Hark-${VERSION}-linux-x64.tar.gz" -C tarball "Hark-${VERSION}-linux-x64"

          cp "$(ls target/debian/*.deb)" "dist/Hark-${VERSION}-linux-x64.deb"
          cp "$(ls target/generate-rpm/*.rpm)" "dist/Hark-${VERSION}-linux-x64.rpm"
          ls -la dist

      # Append only, same as the Windows job: the `version` job owns the release
      # body, and asking for notes again would overwrite it on every upload.
      - name: Attach the Linux assets to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            dist/Hark-${{ needs.version.outputs.version }}-linux-x64.deb
            dist/Hark-${{ needs.version.outputs.version }}-linux-x64.rpm
            dist/Hark-${{ needs.version.outputs.version }}-linux-x64.tar.gz

  # ---------------------------------------------------------------------------
  # Arch: a real .pkg.tar.zst, built by makepkg inside an Arch container.
  #
  # Built natively rather than repackaged from the ubuntu job's binary: that
  # one links against Ubuntu's glibc and GTK sonames, which are not the ones
  # pacman would install. An Arch package has to be built against Arch.
  #
  # STILL `needs: linux`, and not for the release object -- `version` provides
  # that now. The edge is load-bearing on its own: the build below runs
  # `makepkg --nocheck`, and skipping the test suite is only justified because
  # the ubuntu job has already run the whole suite against this exact commit.
  # Point this at `version` alone and that justification evaporates.
  # `version` is in `needs` as well because `needs` exposes only the jobs a job
  # names directly -- outputs do not reach through `linux`.
  #
  # packaging/PKGBUILD is the same file an AUR consumer would use. HARK_SRCDIR
  # switches it to building the checked-out tree, because at this moment the
  # tag's source tarball is what we are producing, not something to download.
  linux-arch:
    name: Arch (pkg.tar.zst)
    needs: [version, linux]
    runs-on: ubuntu-latest
    # Digest-pinned for the same reason every `uses:` here is SHA-pinned: this
    # workflow holds `contents: write`, and `archlinux:base-devel` is a mutable
    # tag rebuilt every few days. A stale digest costs nothing but download
    # time -- the `pacman -Syu` below brings the image current regardless.
    # Refresh with:
    #   docker buildx imagetools inspect archlinux:base-devel
    container:
      image: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d # resolved 2026-08-24
    steps:
      # Before checkout: actions/checkout needs git, and the container image
      # ships without it. A full -Syu rather than -Sy because Arch does not
      # support partial upgrades -- a mixed library set breaks in ways that
      # look like build errors.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust cargo pkgconf cmake clang \
            alsa-lib gtk3 libappindicator-gtk3 libxkbcommon libx11 libxcb xdotool

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # makepkg refuses to run as root, by design, and the container is root.
      # --nocheck because the ubuntu job above already ran the whole suite
      # against this exact commit; the PKGBUILD keeps check() defined for AUR
      # consumers, who have no such guarantee.
      - name: Build the package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          useradd -m builder
          cp packaging/PKGBUILD packaging/hark.install /home/builder/
          chown -R builder:builder /home/builder "$GITHUB_WORKSPACE"
          # git refuses to operate on a tree owned by another user; makepkg's
          # .BUILDINFO generation reads the repo.
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE'"
          su builder -c "cd /home/builder && HARK_SRCDIR='$GITHUB_WORKSPACE' makepkg -f --nocheck --noconfirm"
          mkdir -p dist

          # `hark-[0-9]*`, not `hark-*`: makepkg's default OPTIONS include
          # `debug`, so alongside hark-<ver>-1-x86_64.pkg.tar.zst it also emits
          # hark-debug-<ver>-1-x86_64.pkg.tar.zst. `hark-*` matched both, and cp
          # with three arguments wants a directory last, so 0.36.4 failed on
          # "cp: target 'dist/Hark-0.36.4-linux-x64.pkg.tar.zst': No such file
          # or directory" AFTER a completely successful 13-minute build. The
          # PKGBUILD sets !debug so the second package is not produced at all;
          # this glob is the belt to that braces, the same way the deb/rpm job
          # asserts exactly one artifact rather than trusting its globs.
          count=$(ls /home/builder/hark-[0-9]*-x86_64.pkg.tar.zst | wc -l)
          if [ "$count" != 1 ]; then
            echo "::error::expected exactly one package, found $count"
            ls -la /home/builder/*.pkg.tar.zst
            exit 1
          fi
          cp "$(ls /home/builder/hark-[0-9]*-x86_64.pkg.tar.zst)" \
             "dist/Hark-${VERSION}-linux-x64.pkg.tar.zst"

      # Same gate as the deb/rpm: the tray library is dlopened, so nothing
      # infers it and a dropped `depends` entry would ship a package whose tray
      # silently never appears.
      - name: Verify the package declares its dependencies
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="dist/Hark-${VERSION}-linux-x64.pkg.tar.zst"
          info=$(tar --zstd -xOf "$pkg" .PKGINFO)
          echo "$info" | grep -E '^(pkgname|pkgver|depend)'
          for want in alsa-lib gtk3 xdotool libappindicator-gtk3 libx11 libxkbcommon; do
            echo "$info" | grep -qx "depend = $want" \
              || { echo "::error::PKGBUILD depends is missing $want"; exit 1; }
          done
          # Read the file list ONCE into a variable instead of piping tar into
          # `grep -q`. `grep -q` exits at its first match; tar then has to
          # decompress the ~47 MB binary to reach the next header, and that
          # write lands on a closed pipe. `set -o pipefail` promotes the SIGPIPE
          # to a failed step, so 0.36.5 reported "package does not install
          # /usr/bin/hark" about a package that installs it -- a gate lying
          # about a good build, which is worse than no gate. Reproduced 20/20
          # with the binary early in the archive, which is where makepkg puts
          # it; it passes 20/20 read this way. `echo "$info" | grep -q` above is
          # safe by contrast: a builtin writing a few hundred bytes finishes
          # before grep can exit.
          #
          # The listing is echoed because every step in this job has now failed
          # once for a different reason, and the next one should not need a
          # release to diagnose.
          files=$(tar --zstd -tf "$pkg")
          echo "$files"
          # (\./)? because a leading ./ is a tar-format detail, not a fact about
          # the package. makepkg emits bare paths today.
          echo "$files" | grep -qE '^(\./)?usr/bin/hark$' \
            || { echo "::error::package does not install /usr/bin/hark"; exit 1; }
          echo "$files" | grep -q '70-hark-uinput.rules$' \
            || { echo "::error::package does not install the udev rule; paste will fail on Wayland"; exit 1; }

      - name: Attach the Arch package to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/Hark-${{ needs.version.outputs.version }}-linux-x64.pkg.tar.zst
