# Build, sign, and publish a release of Hark: a signed Windows installer, a
# signed and notarized macOS disk image, plus Linux packages for
# Debian/Ubuntu, Fedora/RHEL/openSUSE and Arch.
#
# Trigger: push a SemVer tag (v0.13.0). The tag's version must match
# package.json (the repo's version source of truth, per
# .claude/rules/commit-changelog.md), or the run fails before building.
# workflow_dispatch is a manual fallback that takes an existing tag.
#
# Signing: Azure Trusted Signing (the service is now branded "Artifact
# Signing"; the action Azure/trusted-signing-action redirects to
# Azure/artifact-signing-action). Auth is a service principal passed via
# the action's own with: inputs (azure-client-id / -tenant-id /
# -client-secret), which it promotes to DefaultAzureCredential's env.
#
# The Linux jobs need no secrets at all: distribution packages are verified by
# the repository they come from, and Hark publishes to GitHub Releases rather
# than to an apt/dnf repo, so there is nothing for a GPG key to sign into.
#
# JOB SHAPE
#
#   version                  verifies the tag
#   |- windows-check         fmt, clippy, test          -.
#   |- windows-build         release exe, clean build   -+-> windows  sign, package, attach
#   |- linux-check           fmt, clippy, test          -.
#   |- linux-build           binary + .deb .rpm .tar.gz -+-> linux    attach
#   |- arch-build            makepkg in an Arch image   ---> arch     attach (also needs linux-check)
#   |- macos-check           fmt, clippy, test          -.
#   `- macos-build           release binary, clean build-+-> macos    sign, notarize, attach
#
#   release   needs version + all three checks; creates the release object.
#             Every publish job above also needs it.
#
# Every platform is split three ways -- checks, a build, and a final job that
# `needs` both -- for speed and for trust.
#
# Speed. Until 0.68.9 each platform ran fmt, clippy, test and the release build
# back to back in one job, uncached: a tag run can read main's caches but not
# another tag's, so the cache every release job saved was never restored.
# Every one logged "No cache found.", compiled the workspace twice (debug for
# the checks, release for the binary), then spent up to two minutes saving
# ~4.7 GB a release that no later run could read and that evicted main's own
# caches. Releases took 28-33 min, with Linux then Arch as the long pole. Now
# the checks restore main's CI cache and run beside the builds, so the wall
# clock is roughly one clean Windows release build plus signing.
#
# Trust. The build jobs never touch a cache (windows-check says why), and no
# check or build job holds a secret or a write token. Those live only in the
# final job for each platform, and none of those compiles anything.
#
# THE RELEASE OBJECT. The `release` job creates it, and every publish job only
# APPENDS. softprops/action-gh-release creates a release when the tag has none
# and updates it when it does, so two jobs that both try to create it race and
# the loser gets a 422. That race is what once kept the builds serial (~81 min);
# hoisting creation into one upstream job is what let them run side by side.
#
# Required GitHub Actions secrets (synced from Doppler). See
# .github/RELEASING.md for the Azure RBAC role and one-time setup:
#   AZURE_CLIENT_ID
#   AZURE_TENANT_ID
#   AZURE_CLIENT_SECRET
#   AZURE_TRUSTED_SIGNING_ENDPOINT           e.g. https://eus.codesigning.azure.net/
#   AZURE_TRUSTED_SIGNING_ACCOUNT_NAME       the Trusted Signing account name
#   AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME  the certificate profile name

name: Release

# DO NOT ADD TRIGGERS HERE. The Azure signing service principal is federated on
# a subject claim derived from the ref, so changing what starts this workflow
# changes the identity presented to Entra and signing fails with
# AADSTS700213 (LL-G github-actions/tag-trigger-breaks-azure-oidc, HIGH).
# Restructuring jobs and steps within the workflow does not touch that claim.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.13.0)"
        required: true

# Read-only by default. `contents: write` is granted per job, only to `release`
# and the four publish jobs, none of which runs cargo. A job that compiles code
# never holds a token able to publish.
#
# EVERY `uses:` IN THIS WORKFLOW IS PINNED BY COMMIT SHA. The publish jobs hold
# that write token and the signing identities, so a floating tag or branch ref
# would let an upstream retag run arbitrary code with the power to sign and
# publish a Hark binary. `dtolnay/rust-toolchain@stable` was the sharpest case:
# `stable` is a mutable BRANCH, not a tag.
permissions:
  contents: read

# ci.yml's `rust` job sets this on every leg, so the check jobs carry it too
# and see the same environment as the cache they restore. It is also the
# deployment target the shipped macOS binary is built for. Inert elsewhere.
env:
  MACOSX_DEPLOYMENT_TARGET: "14.2"

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The gate every other job hangs off. Seconds long: no Rust toolchain, no
  # secrets, nothing to compile, and no write token.
  #
  # The version agreement and the wiring guard sit upstream of every build, so
  # a red guard or a mistagged commit stops the release before any job has
  # built -- or created -- anything.
  version:
    name: Version gate
    runs-on: ubuntu-latest
    # Consumed by every downstream job so the tag/package.json/Cargo.toml
    # agreement is verified exactly once, in the step below, rather than
    # re-derived per job with a chance to disagree.
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # The tag is authoritative for the release; package.json must agree so
      # a mistagged build fails loudly instead of shipping a mismatched exe.
      #
      # Still pwsh, verbatim from when this step lived in the Windows job:
      # PowerShell is preinstalled on the ubuntu runner image, the script is
      # plain cross-platform pwsh, and rewriting a release gate in another
      # language to move it between runners is how a gate quietly stops
      # gating. If the image ever drops pwsh this fails in seconds, loudly,
      # before anything is built.
      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $ref = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($ref -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected a vMAJOR.MINOR.PATCH tag, got '$ref'." }
          $version = $ref.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $pkg) {
            throw "Tag '$ref' (version '$version') does not match package.json version '$pkg'. Bump package.json or retag."
          }
          # The binary reports the Cargo workspace version (env!("CARGO_PKG_VERSION")),
          # which the in-app update checker compares against release tags. It must
          # match package.json, or a shipped build misreports its own version.
          $cargo = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"([^"]+)"')).Groups[1].Value
          if (-not $cargo) { throw "Could not read [workspace.package] version from Cargo.toml." }
          if ($version -ne $cargo) {
            throw "Tag '$ref' (version '$version') does not match Cargo.toml workspace version '$cargo'. Bump Cargo.toml or retag."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$ref"
          Write-Host "Releasing Hark $version from tag $ref"

      # Dependency-free and a few seconds long, which is why it can sit in front
      # of everything without costing anything.
      #
      # This used to be ci.yml's job alone, on the reasoning that the artifact
      # here is Windows so a wiring guard adds nothing. 0.35.4 disproved it: a
      # .claude template sync left the guard failing on main for two weeks, and
      # because ci.yml has no tag trigger, a `v0.35.4` tag would have built,
      # signed and published over a red guard without ever consulting it. The
      # guard is the ONLY check in this workflow that is not otherwise
      # duplicated in the check jobs below, so it is the one this workflow most
      # needed.
      #
      # On ubuntu here, where it once ran on windows-latest, because this job is
      # the common ancestor and gating every build is worth more than the
      # runner it happens to run on. Windows coverage of the guard did not go
      # anywhere: ci.yml runs it on ubuntu AND windows on every push, precisely
      # so a fs.globSync path-separator divergence surfaces there rather than on
      # a release tag.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Claude wiring guard (rule scoping + hook matchers)
        run: npm run check:claude

  # ---------------------------------------------------------------------------
  # THE ONE PLACE A RELEASE IS CREATED, and only once all three platforms'
  # checks have passed. Every publish job needs this one and passes only
  # tag_name and files, so each is a pure append and they cannot race.
  #
  # Until 0.68.9 `version` created the release before anything was checked, so
  # a tag whose tests failed still left an empty release behind -- and the
  # in-app update checker reads `releases/latest` and offers whatever tag it
  # finds, asset or no asset. Waiting for the checks costs no wall clock: they
  # finish before the builds, and every publish job waits on a build anyway.
  #
  # The window is narrower, not gone: a build, signing or upload failure after
  # this point still leaves a release missing that platform's asset. Making it
  # a draft and publishing it at the end would close it, but only if
  # action-gh-release resolves a draft by tag reliably, which is not something
  # to find out during a release.
  #
  # generate_release_notes belongs to this call alone: asking for it again on
  # an append would regenerate the body and overwrite it on every upload. No
  # checkout: the action only talks to the API.
  release:
    name: Release object
    needs: [version, windows-check, linux-check, macos-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Hark ${{ needs.version.outputs.version }}
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Windows: the signed installer, and the only Windows download.
  #
  # THE RELEASE GATE. The check jobs duplicate ci.yml on purpose.
  #
  # ci.yml and release.yml used to be wholly independent, so a tag shipped
  # whatever it pointed at regardless of whether the repo's own checks
  # passed. That is not hypothetical: a stale Windows-only test in
  # hark-hotkey failed CI on every push from 0.33.0 through 0.35.1, and all
  # four Release runs in that window published signed installers anyway.
  #
  # Gating on ci.yml's conclusion instead was considered and rejected.
  # ci.yml deliberately has no tag trigger (adding one changes the OIDC
  # subject claim and breaks Azure signing -- LL-G github-actions, HIGH), so
  # no CI run exists on the tag itself; and workflow_run would run this job
  # in default-branch context, where github.ref is refs/heads/main and the
  # tag-derived version resolution upstream has nothing to read. Querying
  # CI's conclusion for the tagged SHA is racy -- the commit and tag are
  # pushed together, so both workflows start in the same second -- and gives
  # no safe answer when a SHA has no CI run at all (a workflow_dispatch
  # re-release of an old tag). Checking the tree in-process has none of
  # those failure modes: it verifies exactly what is about to be signed.
  #
  # The checks run BESIDE the build, not before it, and that keeps the gate
  # whole: the signing job `needs` both, so a bad tree still never reaches the
  # signing steps and never spends Trusted Signing quota. It just no longer
  # makes an ~11 min build wait for them.
  #
  # SCOPE: this runner is windows-latest, so cargo fmt/clippy/test here catch
  # Windows and platform-independent failures only -- which is exactly why
  # linux-check and macos-check run their own copies rather than trusting
  # this one.
  windows-check:
    name: Windows checks (fmt, clippy, test)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # `toolchain: stable` is a channel, not a version pin: the workspace
      # rust-version = "1.97" floor (Cargo.toml) makes cargo error if the runner's
      # stable is ever older, which is the libsqlite3-sys MSRV trap this guards
      # against.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable
          components: rustfmt, clippy

      # The cache ci.yml's `rust` job saves on main for this OS (same
      # shared-key), restored and never saved. A tag run cannot usefully save
      # one: GitHub scopes a cache to the ref that wrote it, so one saved on
      # v0.68.4 is invisible to v0.68.5.
      #
      # Only the check jobs restore it. They ship nothing and hold no secret
      # and no write token, so whatever a cache could carry in stops here. The
      # build jobs stay cache-free on purpose: anything that runs on main can
      # write main's cache, and the signed binary should not depend on all of
      # it.
      #
      # Debug profile, the one ci.yml builds, so this cache is warm for every
      # command below.
      - name: Restore main's CI cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-checks
          save-if: false

      # Keep in sync with ci.yml: rust-cache preserves stale build-script
      # output and empty lib directories after pruning sherpa's native files.
      - name: Reset sherpa-onnx native cache
        shell: bash
        run: |
          cargo clean --package sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # --all-targets matches ci.yml: without it cargo skips test targets
      # entirely, so lints in tests go unchecked (LL-G
      # rust/cargo-check-skips-test-targets).
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # A clean, uncached release build. Only the exe leaves this job, as an
  # artifact for the signing job; nothing here can sign or publish.
  windows-build:
    name: Windows build (release exe)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable

      # Only hark-app: it is the only binary that ships.
      - name: Build release binary
        run: cargo build --release -p hark-app

      # Five days so a signing job that failed on a Friday can still be re-run
      # on Monday without rebuilding; overwrite so re-running THIS job can
      # upload under the same name again. Every hand-off below does the same.
      - name: Hand the exe to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: target/release/hark-app.exe
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  # The only Windows job that holds the signing identity or a write token, and
  # it compiles nothing: it signs the exe windows-build produced, packages it
  # into the installer, verifies every signature and attaches the installer.
  windows:
    name: Windows (sign, package, attach)
    needs: [version, release, windows-check, windows-build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # For installer\hark.iss and the files it bundles. No Rust toolchain:
      # nothing here compiles.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Into its own folder, so the signing step's non-recursive exe glob can
      # only ever match this one file. download-artifact v8 fails on a digest
      # mismatch by default.
      - name: Fetch the unsigned exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: ${{ runner.temp }}\hark-bin

      # DefaultAzureCredential fails deep inside signtool with an opaque
      # "SignerSign() failed" if any auth/config secret is empty. Catch that
      # here with a clear message. Lengths only, never the values, so the log
      # stays safe to share.
      - name: Preflight signing secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          SIGN_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
        run: |
          $required = @{
            'AZURE_CLIENT_ID'     = $env:AZURE_CLIENT_ID
            'AZURE_TENANT_ID'     = $env:AZURE_TENANT_ID
            'AZURE_CLIENT_SECRET' = $env:AZURE_CLIENT_SECRET
            'AZURE_TRUSTED_SIGNING_ENDPOINT'          = $env:SIGN_ENDPOINT
            'AZURE_TRUSTED_SIGNING_ACCOUNT_NAME'      = $env:SIGN_ACCOUNT
            'AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME' = $env:SIGN_PROFILE
          }
          $missing = @()
          foreach ($name in $required.Keys | Sort-Object) {
            $len = ($required[$name] ?? '').Trim().Length
            Write-Host ("{0,-42} len={1}" -f $name, $len)
            if ($len -eq 0) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            throw "Empty signing secret(s): $($missing -join ', '). Re-sync from Doppler (hark/prd) into the repo's Actions secrets."
          }

      # v2 reads the service principal from its own inputs (which it promotes
      # to action-scoped env vars for DefaultAzureCredential). Passing the
      # credentials via the step's env: does NOT reach that scope, so they
      # must go here under with: or auth fails with "not fully configured".
      - name: Sign hark-app.exe with Azure Trusted Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ runner.temp }}\hark-bin
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A silent no-op signing step must fail the build, not ship unsigned.
      - name: Verify the signature
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'hark-bin\hark-app.exe'
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signature not valid: $($sig.Status) - $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Signature carries no trusted timestamp." }

      # Package the signed exe into a per-user installer (installer/hark.iss).
      # ISCC is not preinstalled on windows-latest. The bundled exe is already
      # signed above; ISCC signs everything else itself, below.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # The installer is signed by ISCC's SignTool, NOT by the signing action
      # after compilation. setup.exe is only a loader: it extracts the real
      # setup engine to %TEMP%\is-XXXXX.tmp\<name>.tmp and runs that, and a
      # signature applied to the finished setup.exe never reaches the engine
      # inside it. 0.60.5 and earlier shipped exactly that -- a valid,
      # verified setup.exe whose engine Smart App Control blocked on every
      # install and every in-app update. Only ISCC can sign the engine,
      # because it does so before embedding it.
      #
      # ISCC needs a plain command line, so this lays down the documented
      # signtool + Artifact Signing dlib pair. Both packages are pinned by
      # version AND sha256: this job holds the signing identity, and a
      # re-uploaded package would run inside it. The versions match what
      # artifact-signing-action v2.0.0 itself installs for the exe step above.
      # Refresh with:
      #   curl -sL https://api.nuget.org/v3-flatcontainer/<id>/<ver>/<id>.<ver>.nupkg | sha256sum
      - name: Set up signtool for Inno Setup
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          SIGN_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'inno-sign'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $packages = @(
            @{ Id = 'microsoft.windows.sdk.buildtools'; Version = '10.0.26100.4188'; Sha256 = '180deb372659029864c10a0c04787833234d64aacd1d2c0661d2c00295d8e022' },
            @{ Id = 'microsoft.artifactsigning.client'; Version = '1.0.128';         Sha256 = '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b' }
          )
          foreach ($pkg in $packages) {
            # .zip, not .nupkg: Expand-Archive refuses any other extension.
            $zip = Join-Path $root "$($pkg.Id).zip"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$($pkg.Id)/$($pkg.Version)/$($pkg.Id).$($pkg.Version).nupkg" -OutFile $zip
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
            if ($hash -ne $pkg.Sha256) { throw "$($pkg.Id) $($pkg.Version): sha256 $hash does not match the pinned $($pkg.Sha256)" }
            Expand-Archive -Path $zip -DestinationPath (Join-Path $root $pkg.Id) -Force
          }
          $signtool = Join-Path $root 'microsoft.windows.sdk.buildtools\bin\10.0.26100.0\x64\signtool.exe'
          $dlib = Join-Path $root 'microsoft.artifactsigning.client\bin\x64\Azure.CodeSigning.Dlib.dll'
          foreach ($f in $signtool, $dlib) { if (-not (Test-Path $f)) { throw "Not found after extraction: $f" } }

          # Only EnvironmentCredential is left enabled: the service principal
          # arrives through AZURE_* env on the ISCC step, and every other
          # DefaultAzureCredential probe is a slow, noisy dead end on a runner.
          $metadata = Join-Path $root 'metadata.json'
          @{
            Endpoint               = $env:SIGN_ENDPOINT.Trim()
            CodeSigningAccountName = $env:SIGN_ACCOUNT.Trim()
            CertificateProfileName = $env:SIGN_PROFILE.Trim()
            ExcludeCredentials     = @(
              'ManagedIdentityCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential',
              'VisualStudioCodeCredential', 'AzureCliCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential',
              'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8NoBOM

          Add-Content -Path $env:GITHUB_ENV -Value "INNO_SIGNTOOL=$signtool"
          Add-Content -Path $env:GITHUB_ENV -Value "INNO_SIGN_DLIB=$dlib"
          Add-Content -Path $env:GITHUB_ENV -Value "INNO_SIGN_METADATA=$metadata"

      # /DSign turns on SignTool=hark in hark.iss; /Shark= defines that command.
      # ISCC runs it for the embedded engine, the uninstaller and the final
      # setup.exe, and fails the compile if any of them fails. The AZURE_* env
      # here is read by the dlib's EnvironmentCredential in each signtool child;
      # unlike the action's with: inputs, a plain process inherits step env.
      # Built with single quotes so pwsh leaves Inno's $q and $f alone.
      - name: Build and sign the installer
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          $sign = '$q' + $env:INNO_SIGNTOOL + '$q sign /v /fd SHA256' +
                  ' /tr http://timestamp.acs.microsoft.com /td SHA256' +
                  ' /dlib $q' + $env:INNO_SIGN_DLIB + '$q' +
                  ' /dmdf $q' + $env:INNO_SIGN_METADATA + '$q $f'
          & $iscc `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DSourceExe=$(Join-Path $env:RUNNER_TEMP 'hark-bin\hark-app.exe')" `
            "/DSign" `
            "/Shark=$sign" `
            installer\hark.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $out = "installer\Output\Hark-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          if (-not (Test-Path $out)) { throw "Installer not produced at $out" }

      # A silent no-op signing step must fail the build, not ship unsigned.
      - name: Verify the installer signature
        shell: pwsh
        run: |
          $exe = "installer\Output\Hark-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature not valid: $($sig.Status) - $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Installer signature carries no trusted timestamp." }

      # The check above passes for a setup.exe whose engine is unsigned -- it
      # did for every release through 0.60.5 -- because it only sees the
      # loader. So run the installer for real (per-user, no UAC) and inspect
      # what it executes: the engine is copied out of %TEMP% while its process
      # is running, which guarantees the loader has finished writing it, and
      # unins000.exe is read after the install. Both must carry a valid,
      # timestamped signature from the same publisher as setup.exe.
      - name: Verify the setup engine and uninstaller signatures
        shell: pwsh
        run: |
          $installer = (Resolve-Path "installer\Output\Hark-${{ needs.version.outputs.version }}-windows-x64-setup.exe").Path
          $publisher = (Get-AuthenticodeSignature $installer).SignerCertificate.Subject
          $dir = Join-Path $env:RUNNER_TEMP 'hark-install-check'
          # .exe, not .tmp, so WinVerifyTrust picks the PE subject package.
          $engine = Join-Path $env:RUNNER_TEMP 'hark-setup-engine.exe'

          $proc = Start-Process -FilePath $installer -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir"
          $null = $proc.Handle  # without this, ExitCode reads back empty
          while (-not $proc.HasExited) {
            if (-not (Test-Path $engine)) {
              $running = Get-Process -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -like '*\is-*.tmp\*.tmp' } | Select-Object -First 1
              if ($running) { Copy-Item -LiteralPath $running.Path -Destination $engine -ErrorAction SilentlyContinue }
            }
            Start-Sleep -Milliseconds 25
          }
          if ($proc.ExitCode -ne 0) { throw "Silent install exited with $($proc.ExitCode)" }
          if (-not (Test-Path $engine)) { throw "Never saw the extracted setup engine running, so its signature is unverified." }

          foreach ($file in $engine, (Join-Path $dir 'unins000.exe')) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$(Split-Path $file -Leaf): $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$file is not validly signed: $($sig.Status) - $($sig.StatusMessage)" }
            if (-not $sig.TimeStamperCertificate) { throw "$file carries no trusted timestamp." }
            if ($sig.SignerCertificate.Subject -ne $publisher) { throw "$file is signed by '$($sig.SignerCertificate.Subject)', not the installer's publisher." }
          }

      # The installer is the only Windows download now. A portable copy of the
      # raw exe used to ship beside it, and it is deliberately gone: it was a
      # second artifact of the same binary that produced an install Windows knew
      # nothing about (no uninstall entry, no upgrade path), and the in-app
      # updater used to self-replace with it -- which updated the binary while
      # leaving Inno's uninstall record pinned at whatever version installed
      # first. hark-update now downloads THIS asset and runs it.
      - name: Stage the signed installer
        id: asset
        shell: pwsh
        run: |
          $installer = "installer\Output\Hark-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found at $installer" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "installer=$installer"

      # Append only. No name and no generate_release_notes: the `release` job
      # set both when it created the release, and passing them again here would
      # overwrite the body every time an asset lands.
      - name: Attach the Windows installer to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: ${{ steps.asset.outputs.installer }}

  # ---------------------------------------------------------------------------
  # Linux: .deb, .rpm and a portable .tar.gz, built and gated on ubuntu.
  #
  # No Linux job waits on a Windows one. A consequence of that, stated plainly:
  # a Windows gate failure does not stop the Linux packages from being
  # attached. Both platforms gate themselves on the same tree, so a failure
  # that would stop one generally stops the other; what is genuinely
  # Windows-only (signing, Inno Setup) can leave a release holding Linux assets
  # and no installer. That is the trade for the wall clock, and it is visible
  # -- a red job on the run, and a release with no .exe.
  #
  # linux-check runs its own fmt/clippy/test pass rather than trusting the
  # Windows one. windows-check runs on windows-latest and so only ever
  # exercises the Windows cfg branches; everything Linux-specific in 0.36.0 --
  # the evdev listener, the uinput paste, the XDG autostart entry, the GTK tray
  # thread -- is invisible to it. Same reasoning the Windows gate is inline:
  # verify exactly what is about to be shipped.
  linux-check:
    name: Linux checks (fmt, clippy, test)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Same list as ci.yml's Linux leg and linux-build below; keep all three
      # in step. The isolated PipeWire socket tests load protocol-native at
      # runtime; its modules package is not pulled in by -dev with no
      # recommends.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libpipewire-0.3-modules \
            libxkbcommon-dev libx11-dev pkg-config cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Same cache, same rules as windows-check: restored from main, never
      # saved, and never anywhere near a shipped binary.
      - name: Restore main's CI cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-checks
          save-if: false

      # Keep in sync with ci.yml: rust-cache preserves stale build-script
      # output and empty lib directories after pruning sherpa's native files.
      - name: Reset sherpa-onnx native cache
        shell: bash
        run: |
          cargo clean --package sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # --all-targets matches ci.yml: without it cargo skips test targets
      # entirely, so lints in tests go unchecked (LL-G
      # rust/cargo-check-skips-test-targets).
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # GLIBC FLOOR. The binary is dynamically linked, so it requires at least the
  # glibc of the runner that built it -- currently 2.39 (Ubuntu 24.04), which
  # covers Ubuntu 24.04+, Debian 13+ and Fedora 40+, and excludes Debian 12.
  # Building on an older image would widen that, but ubuntu-22.04 begins
  # deprecation in September 2026 and is unsupported from April 2027, so
  # pinning to it would trade a known limitation for a scheduled outage.
  # packaging/LINUX.md states the requirement.
  #
  # Builds AND packages here, uncached, because cargo-deb and cargo-generate-rpm
  # read target/release directly; only the finished packages leave the job.
  linux-build:
    name: Linux build (binary, deb, rpm, tarball)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Same list as linux-check. Linking needs the -dev packages, and
      # dpkg-shlibdeps needs the runtime libraries installed to map the
      # binary's sonames to Depends.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libpipewire-0.3-modules \
            libxkbcommon-dev libx11-dev pkg-config cmake clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release -p hark-app

      # cargo-deb ships a .deb of itself with each GitHub release, so it
      # installs in seconds instead of compiling. It is pinned by version AND by
      # the sha256 GitHub records for that asset, because this job builds the
      # packages users install and a re-uploaded binary here could alter them.
      # cargo-generate-rpm publishes no binaries, so it still compiles -- but at
      # a pinned version with --locked, not whatever crates.io serves that day.
      # Until 0.68.9 both were `cargo install`ed unpinned, and the step's
      # comment claimed the cache made that a one-off; the cache never restored,
      # so it cost ~2.3 min every release.
      # Refresh with:
      #   gh api repos/kornelski/cargo-deb/releases/tags/v<ver> --jq '.assets[] | .name + " " + .digest'
      - name: Install packaging tools
        env:
          DEB_TOOL_VERSION: 3.8.0
          DEB_TOOL_SHA256: c6bd0a4affaa232814cc615b2597457f1d44fdfe1c8ebd643f3a491a1f244040
          RPM_TOOL_VERSION: 0.21.1
        run: |
          set -euo pipefail
          deb="$RUNNER_TEMP/cargo-deb_${DEB_TOOL_VERSION}-1_amd64.deb"
          curl -fsSL --retry 3 -o "$deb" \
            "https://github.com/kornelski/cargo-deb/releases/download/v${DEB_TOOL_VERSION}/cargo-deb_${DEB_TOOL_VERSION}-1_amd64.deb"
          echo "${DEB_TOOL_SHA256}  ${deb}" | sha256sum -c -
          sudo apt-get install -y --no-install-recommends "$deb"
          command -v cargo-deb
          cargo install cargo-generate-rpm --version "$RPM_TOOL_VERSION" --locked

      # --no-build: package the binary built above rather than rebuilding it
      # under a different profile. Metadata lives in crates/hark-app/Cargo.toml.
      - name: Build the .deb
        run: cargo deb -p hark-app --no-build

      - name: Build the .rpm
        run: cargo generate-rpm -p crates/hark-app --payload-compress zstd

      # A REAL GATE, not a printout. The tray is loaded through dlopen
      # (libappindicator-sys uses libloading), so it never appears in the
      # binary's DT_NEEDED and neither dpkg-shlibdeps nor rpm's auto-req can
      # infer it. crates/hark-app/Cargo.toml names it explicitly -- and if that
      # line is ever dropped, the packages still build, still install, and the
      # tray simply never appears, with no error anywhere. This step is the only
      # thing that would notice.
      #
      # The $auto-derived entries are checked too: dpkg-shlibdeps failing to
      # launch is a WARNING, not an error, and produces a package that declares
      # no library dependencies at all.
      - name: Verify package dependencies and required files
        run: |
          set -euo pipefail
          # Assert exactly one artifact rather than letting a glob quietly pick
          # one of several: `cp $(ls *.rpm) dest` silently misbehaves on two.
          [ "$(ls target/debian/*.deb | wc -l)" = 1 ] || { echo "::error::expected exactly one .deb"; exit 1; }
          [ "$(ls target/generate-rpm/*.rpm | wc -l)" = 1 ] || { echo "::error::expected exactly one .rpm"; exit 1; }
          deb=$(ls target/debian/*.deb)
          depends=$(dpkg-deb -f "$deb" Depends)
          echo "deb Depends: $depends"
          for want in libayatana-appindicator3-1 libasound2 libgtk-3-0 libc6 libpipewire-0.3-0; do
            case "$depends" in
              *"$want"*) ;;
              *) echo "::error::.deb Depends is missing $want -- see the packaging metadata in crates/hark-app/Cargo.toml"; exit 1 ;;
            esac
          done

          rpm=$(ls target/generate-rpm/*.rpm)
          requires=$(rpm -qpR "$rpm")
          echo "rpm Requires:"; echo "$requires"
          for want in libayatana-appindicator3.so.1 libasound.so.2 libgtk-3.so.0 libpipewire-0.3.so.0; do
            case "$requires" in
              *"$want"*) ;;
              *) echo "::error::.rpm Requires is missing $want -- see the packaging metadata in crates/hark-app/Cargo.toml"; exit 1 ;;
            esac
          done

          # The binary must land where packaging/hark.desktop's Exec line points,
          # or the launcher entry is dead on arrival.
          # Captured once rather than piped into `grep -q` twice, for the reason
          # spelled out in the Arch build's verify step: grep -q exits at the
          # match, the producer's next write hits a closed pipe, and pipefail
          # turns that into a failed check on a good package. These two have
          # passed every release so far -- dpkg-deb gets its listing out fast
          # enough -- but it is the same loaded gun, and a gate that can lie
          # about a good build is worse than no gate.
          contents=$(dpkg-deb -c "$deb")
          echo "$contents" | grep -q ' ./usr/bin/hark$' \
            || { echo "::error::.deb does not install /usr/bin/hark"; exit 1; }
          echo "$contents" | grep -q '70-hark-uinput.rules$' \
            || { echo "::error::.deb does not install the udev rule; paste will fail on Wayland"; exit 1; }
          grep -qE ' ./usr/share/doc/hark/THIRD_PARTY_NOTICES\.md(\.gz)?$' <<< "$contents" \
            || { echo "::error::.deb is missing third-party notices"; exit 1; }
          rpm_contents=$(rpm -qpl "$rpm")
          grep -Fxq '/usr/share/doc/hark/THIRD_PARTY_NOTICES.md' <<< "$rpm_contents" \
            || { echo "::error::.rpm is missing third-party notices"; exit 1; }

      # The escape hatch for distributions the three package formats do not
      # cover. Carries the support files too, because without the udev rule
      # there is no Wayland paste; packaging/LINUX.md has the install commands.
      - name: Stage the assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist "tarball/Hark-${VERSION}-linux-x64"
          cp target/release/hark-app "tarball/Hark-${VERSION}-linux-x64/hark"
          cp packaging/hark.desktop packaging/hark.svg \
             packaging/70-hark-uinput.rules packaging/hark-uinput.conf \
             packaging/LINUX.md LICENSE README.md THIRD_PARTY_NOTICES.md \
             "tarball/Hark-${VERSION}-linux-x64/"
          tar -czf "dist/Hark-${VERSION}-linux-x64.tar.gz" -C tarball "Hark-${VERSION}-linux-x64"
          tarball_contents=$(tar -tzf "dist/Hark-${VERSION}-linux-x64.tar.gz")
          grep -Fxq "Hark-${VERSION}-linux-x64/THIRD_PARTY_NOTICES.md" <<< "$tarball_contents" \
            || { echo "::error::tarball is missing third-party notices"; exit 1; }

          cp "$(ls target/debian/*.deb)" "dist/Hark-${VERSION}-linux-x64.deb"
          cp "$(ls target/generate-rpm/*.rpm)" "dist/Hark-${VERSION}-linux-x64.rpm"
          ls -la dist

      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: dist/
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  # Publishes only, once both the suite and the packages are good.
  linux:
    name: Linux (attach deb, rpm, tarball)
    needs: [version, release, linux-check, linux-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist

      # Uploaded one file at a time with `gh`, NOT softprops/action-gh-release.
      #
      # That action starts every path in `files:` at once, and each upload
      # creates its own asset temp directory. With three files racing, one of
      # them loses and the step dies with "Error creating asset temp dir".
      # v0.44.0 shipped without its .rpm exactly this way -- the .deb and the
      # tarball uploaded fine, so which file loses is luck. Appending is still
      # append-only: the `release` job owns the release body and nothing here
      # asks for notes.
      #
      # This is the loop the Arch job uses too, for the same reasons:
      # `--clobber` replaces a partial asset left by a failed attempt, the
      # digest check catches a silent truncation rather than publishing one,
      # and every request is bounded so a stall leaves time to retry.
      - name: Attach the Linux assets to the release
        shell: bash
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Recovery completed over HTTP/1.1 after HTTP/2 uploads stalled.
          GODEBUG: http2client=0
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Deliberately unquoted below: these names never contain spaces, and
          # word splitting is how the list becomes three iterations.
          names="Hark-${VERSION}-linux-x64.deb"
          names="${names} Hark-${VERSION}-linux-x64.rpm"
          names="${names} Hark-${VERSION}-linux-x64.tar.gz"
          for name in $names; do
            asset="dist/${name}"
            test -s "$asset"
            digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            query=".assets[] | select(.name == \"${name}\" and .state == \"uploaded\") | .digest"
            uploaded=""
            for attempt in 1 2 3; do
              if timeout 90s gh release upload "$TAG" "$asset" --clobber; then
                remote_digest=$(timeout 30s gh release view "$TAG" --json assets --jq "$query") || remote_digest=""
                if [ "$remote_digest" = "$digest" ]; then
                  echo "Verified uploaded asset ${name}: ${digest}"
                  uploaded=yes
                  break
                fi
                echo "::warning::Could not verify the SHA-256 digest of ${name}"
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::${name} upload attempt ${attempt} failed; retrying"
                sleep "$((attempt * 5))"
              fi
            done
            if [ -z "$uploaded" ]; then
              echo "::error::${name} upload failed after 3 attempts"
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  # Arch: a real .pkg.tar.zst, built by makepkg inside an Arch container.
  #
  # Built natively rather than repackaged from linux-build's binary: that one
  # links against Ubuntu's glibc and GTK sonames, which are not the ones pacman
  # would install. An Arch package has to be built against Arch.
  #
  # The build runs `makepkg --nocheck`, and skipping the suite is only
  # defensible because the ubuntu suite has passed against this exact commit.
  # That edge used to be `needs: linux` on the whole Arch job, which put its
  # 8-13 min build after Linux's ~19 min and made the pair the release's long
  # pole. Now the BUILD starts with everything else and only the PUBLISH job
  # needs linux-check: nothing reaches the release that the suite has not
  # passed, which is all the edge was ever for. Point `arch` at arch-build
  # alone and that justification evaporates.
  #
  # packaging/PKGBUILD is the same file an AUR consumer would use. HARK_SRCDIR
  # switches it to building the checked-out tree, because at this moment the
  # tag's source tarball is what we are producing, not something to download.
  arch-build:
    name: Arch build (pkg.tar.zst)
    needs: version
    runs-on: ubuntu-latest
    # Digest-pinned for the same reason every `uses:` here is SHA-pinned:
    # `archlinux:base-devel` is a mutable tag rebuilt every few days, and this
    # job builds a package users install. A stale digest costs nothing but
    # download time -- the `pacman -Syu` below brings the image current
    # regardless.
    # Refresh with:
    #   docker buildx imagetools inspect archlinux:base-devel
    container:
      image: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d # resolved 2026-08-24
    steps:
      # Before checkout: actions/checkout needs git, and the container image
      # ships without it. A full -Syu rather than -Sy because Arch does not
      # support partial upgrades -- a mixed library set breaks in ways that
      # look like build errors.
      # Arch package names, not Debian ones: there is no `libclang` package
      # (bindgen's libclang.so ships in `clang`), and PipeWire's headers and .pc
      # are `libpipewire`. An unknown name fails the whole transaction with
      # "target not found". `cargo` is left to `rust`: naming the virtual
      # package makes pacman stop at a provider prompt. No github-cli: the
      # upload happens in the `arch` job, outside this container.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust pkgconf cmake clang \
            alsa-lib gtk3 libappindicator-gtk3 libxkbcommon libx11 libxcb \
            pipewire libpipewire

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # makepkg refuses to run as root, by design, and the container is root.
      # --nocheck because the `arch` job will not publish until linux-check has
      # run the whole suite against this exact commit; the PKGBUILD keeps
      # check() defined for AUR consumers, who have no such guarantee.
      - name: Build the package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          useradd -m builder
          cp packaging/PKGBUILD packaging/hark.install /home/builder/
          # makepkg records pkgver inside the archive; renaming the asset does
          # not update it. Use the version already checked against the tag.
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" /home/builder/PKGBUILD
          grep -Fxq "pkgver=${VERSION}" /home/builder/PKGBUILD
          chown -R builder:builder /home/builder "$GITHUB_WORKSPACE"
          # git refuses to operate on a tree owned by another user; makepkg's
          # .BUILDINFO generation reads the repo.
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE'"
          su builder -c "cd /home/builder && HARK_SRCDIR='$GITHUB_WORKSPACE' makepkg -f --nocheck --noconfirm"
          mkdir -p dist

          # `hark-[0-9]*`, not `hark-*`: makepkg's default OPTIONS include
          # `debug`, so alongside hark-<ver>-1-x86_64.pkg.tar.zst it also emits
          # hark-debug-<ver>-1-x86_64.pkg.tar.zst. `hark-*` matched both, and cp
          # with three arguments wants a directory last, so 0.36.4 failed on
          # "cp: target 'dist/Hark-0.36.4-linux-x64.pkg.tar.zst': No such file
          # or directory" AFTER a completely successful 13-minute build. The
          # PKGBUILD sets !debug so the second package is not produced at all;
          # this glob is the belt to that braces, the same way the deb/rpm job
          # asserts exactly one artifact rather than trusting its globs.
          count=$(ls /home/builder/hark-[0-9]*-x86_64.pkg.tar.zst | wc -l)
          if [ "$count" != 1 ]; then
            echo "::error::expected exactly one package, found $count"
            ls -la /home/builder/*.pkg.tar.zst
            exit 1
          fi
          cp "$(ls /home/builder/hark-[0-9]*-x86_64.pkg.tar.zst)" \
             "dist/Hark-${VERSION}-linux-x64.pkg.tar.zst"

      # Same gate as the deb/rpm: the tray library is dlopened, so nothing
      # infers it and a dropped `depends` entry would ship a package whose tray
      # silently never appears.
      - name: Verify package dependencies and required files
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="dist/Hark-${VERSION}-linux-x64.pkg.tar.zst"
          info=$(tar --zstd -xOf "$pkg" .PKGINFO)
          echo "$info" | grep -E '^(pkgname|pkgver|depend)'
          echo "$info" | grep -Fxq "pkgver = ${VERSION}-1" \
            || { echo "::error::Arch package version does not match the release"; exit 1; }
          for want in alsa-lib gtk3 libappindicator-gtk3 libx11 libxkbcommon pipewire; do
            echo "$info" | grep -qx "depend = $want" \
              || { echo "::error::PKGBUILD depends is missing $want"; exit 1; }
          done
          # Read the file list ONCE into a variable instead of piping tar into
          # `grep -q`. `grep -q` exits at its first match; tar then has to
          # decompress the ~47 MB binary to reach the next header, and that
          # write lands on a closed pipe. `set -o pipefail` promotes the SIGPIPE
          # to a failed step, so 0.36.5 reported "package does not install
          # /usr/bin/hark" about a package that installs it -- a gate lying
          # about a good build, which is worse than no gate. Reproduced 20/20
          # with the binary early in the archive, which is where makepkg puts
          # it; it passes 20/20 read this way. `echo "$info" | grep -q` above is
          # safe by contrast: a builtin writing a few hundred bytes finishes
          # before grep can exit.
          #
          # The listing is echoed because every step in this job has now failed
          # once for a different reason, and the next one should not need a
          # release to diagnose.
          files=$(tar --zstd -tf "$pkg")
          echo "$files"
          # (\./)? because a leading ./ is a tar-format detail, not a fact about
          # the package. makepkg emits bare paths today.
          echo "$files" | grep -qE '^(\./)?usr/bin/hark$' \
            || { echo "::error::package does not install /usr/bin/hark"; exit 1; }
          echo "$files" | grep -q '70-hark-uinput.rules$' \
            || { echo "::error::package does not install the udev rule; paste will fail on Wayland"; exit 1; }
          grep -qE '^(\./)?usr/share/licenses/hark/THIRD_PARTY_NOTICES\.md$' <<< "$files" \
            || { echo "::error::Arch package is missing third-party notices"; exit 1; }

      - name: Hand the package to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          path: dist/
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  # `version` is in `needs` alongside the jobs this waits on because
  # `needs` exposes only the jobs a job names directly -- outputs do not reach
  # through arch-build.
  arch:
    name: Arch (attach pkg.tar.zst)
    needs: [version, release, linux-check, arch-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-package
          path: dist

      - name: Attach the Arch package to the release
        shell: bash
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Recovery completed over HTTP/1.1 after HTTP/2 uploads stalled.
          GODEBUG: http2client=0
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="Hark-${VERSION}-linux-x64.pkg.tar.zst"
          pkg="dist/${name}"
          test -s "$pkg"
          digest="sha256:$(sha256sum "$pkg" | cut -d ' ' -f 1)"

          # v0.42.0 built successfully but GitHub rejected the asset with
          # "Error saving asset". Retry the upload without rebuilding, and
          # replace any incomplete asset left behind by a failed attempt.
          # Bound each request so a stalled upload leaves time for retries.
          for attempt in 1 2 3; do
            if timeout 90s gh release upload "$TAG" "$pkg" --clobber; then
              if remote_digest=$(timeout 30s gh release view "$TAG" --json assets \
                --jq ".assets[] | select(.name == \"${name}\" and .state == \"uploaded\") | .digest") \
                && [ "$remote_digest" = "$digest" ]; then
                echo "Verified uploaded asset ${name}: ${digest}"
                exit 0
              fi
              echo "::warning::Could not verify the uploaded asset's SHA-256 digest"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Arch asset upload attempt ${attempt} failed; retrying"
              sleep "$((attempt * 5))"
            fi
          done
          echo "::error::Arch asset upload failed after 3 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # macOS: a signed, notarized Apple Silicon disk image. Same three-way split
  # as Windows: macos-check gates, macos-build compiles clean, and only
  # `macos` touches the Developer ID or the release.
  macos-check:
    name: macOS checks (fmt, clippy, test)
    needs: version
    runs-on: macos-15
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Same cache, same rules as windows-check.
      - name: Restore main's CI cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-checks
          save-if: false

      - name: Reset sherpa-onnx native cache
        run: |
          cargo clean --package sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  macos-build:
    name: macOS build (arm64 binary)
    needs: version
    runs-on: macos-15
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-07
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release -p hark-app

      - name: Hand the binary to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-binary
          path: target/release/hark-app
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  macos:
    name: macOS (arm64, sign, notarize, attach)
    needs: [version, release, macos-check, macos-build]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      # For scripts/package-macos.sh and the bundle resources it copies.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # upload-artifact drops Unix mode bits; package-macos.sh chmods the copy
      # it bundles to 755, so the downloaded file needs no fix-up.
      - name: Fetch the unsigned binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-binary
          path: ${{ runner.temp }}/hark-bin

      - name: Import Developer ID and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD APPLE_ID TEAM_ID APP_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing macOS signing secret: $name"; exit 1; }
          done
          keychain="$RUNNER_TEMP/hark-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/hark-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/hark-signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials hark-notary --keychain "$keychain" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          rm "$RUNNER_TEMP/hark-signing.p12"

      - name: Package, sign and notarize
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: hark-notary
          MACOS_NOTARY_KEYCHAIN: ${{ runner.temp }}/hark-signing.keychain-db
          HARK_RELEASE: "1"
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: arm64
        run: bash scripts/package-macos.sh "$RUNNER_TEMP/hark-bin/hark-app" dist "$VERSION" "$ARCH"

      - name: Verify packaged executable starts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: test "$(dist/Hark.app/Contents/MacOS/hark-app --version)" = "Hark $VERSION"

      - name: Publish notarized disk image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: arm64
        run: gh release upload "$TAG" "dist/Hark-$VERSION-macos-$ARCH.dmg" --clobber

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hark-signing.p12"
          if [[ -f "$RUNNER_TEMP/hark-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/hark-signing.keychain-db"
          fi
